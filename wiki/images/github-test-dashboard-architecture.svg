<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <ns0:defs>
    <ns0:style>
        .layer-box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 8; }
