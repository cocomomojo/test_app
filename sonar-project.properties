sonar.projectKey=cocomomojo_test_app
sonar.organization=cocomomojo

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/test
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/tests/e2e/**,frontend/test-results/**,**/*.d.ts
sonar.test.inclusions=frontend/src/test/**/*.js,backend/src/test/java/**/*.java
sonar.qualitygate.wait=true
