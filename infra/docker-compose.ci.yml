version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  moto:
    image: motoserver/moto:latest
    ports:
      - "5000:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/reset', data=b'').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  springboot:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ci
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/app/jacoco/jacocoagent.jar=destfile=/app/jacoco-output/jacoco.exec,output=file,append=false
    ports:
      - "8080:8080"
    volumes:
      - ./jacoco:/app/jacoco:ro
      - ./jacoco-output:/app/jacoco-output
    depends_on:
      mysql:
        condition: service_healthy
      moto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      springboot:
        condition: service_healthy
