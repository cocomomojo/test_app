version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      # すべてのプロダクション依存関係を1つのPRにまとめる
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # すべての開発依存関係を1つのPRにまとめる
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # メジャーアップデートもグループ化（プロダクション）
      production-major:
        dependency-type: "production"
        update-types:
          - "major"
      # メジャーアップデートもグループ化（開発）
      development-major:
        dependency-type: "development"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "frontend"
      - "automerge"
    reviewers:
      - "cocomomojo"

  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      # Spring Boot関連を1つにまとめる
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"
      # AWS SDK関連を1つにまとめる
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
        update-types:
          - "minor"
          - "patch"
      # その他のマイナー/パッチアップデートをまとめる
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "software.amazon.awssdk:*"
        update-types:
          - "minor"
          - "patch"
      # メジャーアップデート用グループ
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "backend"
      - "automerge"
    reviewers:
      - "cocomomojo"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      # すべてのGitHub Actionsアップデートを1つのPRにまとめる
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # メジャーアップデート用
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    reviewers:
      - "cocomomojo"
