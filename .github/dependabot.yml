version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: 1
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      # すべてのプロダクション依存関係（マイナー・パッチのみ）を1つのPRにまとめる
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # すべての開発依存関係（マイナー・パッチのみ）を1つのPRにまとめる
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"
      - "automerge"
    reviewers:
      - "cocomomojo"
    ignore:
      - dependency-name: "vue-router"
        update-types:
          - "major"

  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: 1
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      # Spring Boot関連（マイナー・パッチのみ）を1つにまとめる
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"
      # AWS SDK関連（マイナー・パッチのみ）を1つにまとめる
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
        update-types:
          - "minor"
          - "patch"
      # その他のマイナー/パッチアップデートをまとめる（メジャーバージョンアップは除外）
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "software.amazon.awssdk:*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"
      - "automerge"
    reviewers:
      - "cocomomojo"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: 1
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      # すべてのGitHub Actionsアップデート（マイナー・パッチのみ）を1つのPRにまとめる
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    reviewers:
      - "cocomomojo"
