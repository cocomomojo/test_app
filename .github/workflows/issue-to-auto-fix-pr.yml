name: Issue to Auto Fix PR (Pilot)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'auto fix PR を作成する issue 番号'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
      AUTO_FIX_TOKEN_SECRET_NAME: AUTO_FIX_GITHUB_TOKEN

    steps:
      - name: Setup Scripts
        uses: github/gh-aw/actions/setup@a0ed2f46906483dcf634e8694268e4fab9b21e65
        with:
          destination: /opt/gh-aw/actions

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate COPILOT_GITHUB_TOKEN secret
        run: /opt/gh-aw/actions/validate_multi_secret.sh COPILOT_GITHUB_TOKEN 'GitHub Copilot CLI' https://github.github.com/gh-aw/reference/engines/#github-copilot-default
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Detect AUTO_FIX_GITHUB_TOKEN secret
        id: auto_fix_token
        env:
          AUTO_FIX_GITHUB_TOKEN: ${{ secrets[env.AUTO_FIX_TOKEN_SECRET_NAME] }}
        run: |
          if [ -n "$AUTO_FIX_GITHUB_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'reason=configured' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'reason=AUTO_FIX_GITHUB_TOKEN secret is not configured' >> "$GITHUB_OUTPUT"
          fi

      - name: Install GitHub Copilot CLI
        run: /opt/gh-aw/actions/install_copilot_cli.sh 0.0.421

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Fetch issue payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/auto-fix/output
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels > /tmp/auto-fix/issue.json

      - name: Classify issue
        run: |
          node scripts/issue-tools.js classify \
            --issue-file /tmp/auto-fix/issue.json \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/auto-fix/triage.json

      - name: Determine pilot eligibility
        id: eligibility
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const triage = JSON.parse(fs.readFileSync('/tmp/auto-fix/triage.json', 'utf8'));
          const supportedPatterns = new Set(['frontend-ui-text']);
          const supportedSeverities = new Set(['low', 'medium']);

          let supported = triage.aiFixable === true;
          let reason = 'ai_fixable=false';

          if (supported && !supportedPatterns.has(triage.bugPattern)) {
            supported = false;
            reason = `pilot 対象外の bug pattern: ${triage.bugPattern || 'unresolved'}`;
          } else if (supported && !supportedSeverities.has(triage.severity)) {
            supported = false;
            reason = `pilot 対象外の severity: ${triage.severity || 'unknown'}`;
          } else if (supported) {
            reason = 'supported';
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${reason}\n`);
          NODE

      - name: Generate fix brief
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          node scripts/issue-tools.js generate-fix-brief \
            --issue-file /tmp/auto-fix/issue.json \
            --triage-file /tmp/auto-fix/triage.json \
            --out-dir /tmp/auto-fix/output

      - name: Generate PR draft
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          node scripts/pr-tools.js generate-pr-draft \
            --fix-brief /tmp/auto-fix/output/fix-brief-issue-${ISSUE_NUMBER}.json \
            --out-dir /tmp/auto-fix/output

      - name: Generate auto-fix prompt
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          node scripts/issue-tools.js generate-auto-fix-prompt \
            --fix-brief /tmp/auto-fix/output/fix-brief-issue-${ISSUE_NUMBER}.json \
            --out /tmp/auto-fix/output/prompt.txt

      - name: Execute GitHub Copilot CLI
        id: copilot
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          /usr/local/bin/copilot \
            --add-dir "${GITHUB_WORKSPACE}" \
            --add-dir "/tmp/auto-fix" \
            --disable-builtin-mcps \
            --allow-all-tools \
            --allow-all-paths \
            --prompt "$(cat /tmp/auto-fix/output/prompt.txt)"
        env:
          COPILOT_AGENT_RUNNER_TYPE: STANDALONE
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: /home/runner

      - name: Validate changed files
        id: validate_changes
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          node scripts/pr-tools.js validate \
            --fix-brief /tmp/auto-fix/output/fix-brief-issue-${ISSUE_NUMBER}.json \
            --out /tmp/auto-fix/output/validation.json

      - name: Install frontend dependencies
        if: steps.eligibility.outputs.supported == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend validation
        id: frontend_validation
        if: steps.eligibility.outputs.supported == 'true'
        working-directory: frontend
        run: |
          npx vitest run tests/unit/LoginPage.test.js
          npm run build

      - name: Extract PR metadata
        id: pr_meta
        if: steps.eligibility.outputs.supported == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(`/tmp/auto-fix/output/pr-draft-issue-${process.env.ISSUE_NUMBER}.json`, 'utf8'));
          const branch = payload.branch || `auto-fix/issue-${process.env.ISSUE_NUMBER}`;
          const title = payload.title || `fix: issue #${process.env.ISSUE_NUMBER}`;
          const bodyPath = `/tmp/auto-fix/output/pr-draft-issue-${process.env.ISSUE_NUMBER}.md`;
          const commitMessage = `fix: auto-resolve issue #${process.env.ISSUE_NUMBER}`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `branch=${branch}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body_path=${bodyPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit_message=${commitMessage}\n`);
          NODE

      - name: Create pull request
        id: create_pr
        if: steps.eligibility.outputs.supported == 'true' && steps.auto_fix_token.outputs.available == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets[env.AUTO_FIX_TOKEN_SECRET_NAME] }}
          branch: ${{ steps.pr_meta.outputs.branch }}
          base: main
          title: ${{ steps.pr_meta.outputs.title }}
          body-path: ${{ steps.pr_meta.outputs.body_path }}
          commit-message: ${{ steps.pr_meta.outputs.commit_message }}
          draft: true
          delete-branch: false

      - name: Comment issue with auto-fix result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPPORTED: ${{ steps.eligibility.outputs.supported }}
          REASON: ${{ steps.eligibility.outputs.reason }}
          AUTO_FIX_TOKEN_AVAILABLE: ${{ steps.auto_fix_token.outputs.available }}
          AUTO_FIX_TOKEN_REASON: ${{ steps.auto_fix_token.outputs.reason }}
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_changes.outcome }}
          TEST_OUTCOME: ${{ steps.frontend_validation.outcome }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.create_pr.outputs.pull-request-operation }}
          PR_BRANCH: ${{ steps.pr_meta.outputs.branch }}
        with:
          script: |
            const marker = '<!-- issue-to-auto-fix-pr -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            let body;
            if (process.env.SUPPORTED !== 'true') {
              body = [
                marker,
                '### 🤖 Auto Fix PR Pilot',
                '',
                '- status: skipped',
                `- reason: ${process.env.REASON || 'unsupported'}`,
              ].join('\n');
            } else if (process.env.AUTO_FIX_TOKEN_AVAILABLE !== 'true') {
              body = [
                marker,
                '### 🤖 Auto Fix PR Pilot',
                '',
                '- status: skipped',
                `- reason: ${process.env.AUTO_FIX_TOKEN_REASON || 'AUTO_FIX_GITHUB_TOKEN unavailable'}`,
                '- pr_auth: missing',
              ].join('\n');
            } else {
              const prUrl = process.env.PR_URL || '';
              const status = prUrl ? 'pr-created' : 'failed-before-pr';
              body = [
                marker,
                '### 🤖 Auto Fix PR Pilot',
                '',
                `- status: ${status}`,
                '- pr_auth: configured',
                `- copilot: ${process.env.COPILOT_OUTCOME || 'unknown'}`,
                `- changed_files_validation: ${process.env.VALIDATE_OUTCOME || 'unknown'}`,
                `- validation_tests: ${process.env.TEST_OUTCOME || 'unknown'}`,
                `- pr_operation: ${process.env.PR_OPERATION || 'none'}`,
                `- branch: ${process.env.PR_BRANCH || 'unknown'}`,
                prUrl ? `- pr_url: ${prUrl}` : '- pr_url: not-created',
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }