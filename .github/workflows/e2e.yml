name: E2E Tests with Coverage

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JaCoCo agent from Gradle
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew copyJacocoAgent
          mkdir -p ../infra/jacoco ../infra/jacoco-output
          cp build/jacoco/jacocoagent.jar ../infra/jacoco/jacocoagent.jar

      - name: Start Docker Compose services
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        working-directory: infra
        timeout-minutes: 5
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null && break
            [ "$i" -eq 30 ] && { echo "MySQL failed"; exit 1; }
            sleep 3
          done

          echo "Waiting for Spring Boot..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "Spring Boot ready"; break; }
            [ "$i" -eq 60 ] && { docker compose -f docker-compose.ci.yml logs springboot; exit 1; }
            sleep 3
          done

          echo "Waiting for Frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 > /dev/null && { echo "Frontend ready"; break; }
            [ "$i" -eq 30 ] && { docker compose -f docker-compose.ci.yml logs frontend; exit 1; }
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify E2E test setup
        working-directory: frontend
        run: |
          echo "=== Playwright Test Setup Verification ==="
          echo "📁 Frontend directory:"
          pwd
          echo ""
          echo "📋 Test files:"
          ls -la tests/e2e/*.spec.ts 2>/dev/null | head -10 || echo "No test files found"
          echo ""
          echo "🔧 Playwright config:"
          [ -f "playwright.config.ts" ] && echo "✓ playwright.config.ts exists" || echo "✗ playwright.config.ts missing"
          echo ""
          echo "📦 Playwright version:"
          npx playwright --version
          echo ""
          echo "🌐 Base URL (will use):"
          echo "PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://localhost:8081}"

      - name: Run Playwright E2E tests (with JS coverage)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: |
          set +e
          npm run test:e2e
          echo "E2E_EXIT_CODE=$?" >> $GITHUB_ENV
          set -e

      - name: Debug - Check Playwright coverage collection
        if: always()
        working-directory: frontend
        run: |
          echo "=== 🔍 E2E Test Execution Summary ==="
          
          # Check test results
          if [ -f "test-results/results.json" ]; then
            echo "✓ Test results file exists"
            echo "  - Total size: $(wc -c < test-results/results.json) bytes"
            
            # Use more specific patterns for counting
            test_count=$(grep -o '"type":"test"' test-results/results.json | wc -l)
            failed_count=$(grep -o '"status":"failed"' test-results/results.json | wc -l)
            passed_count=$(grep -o '"status":"passed"' test-results/results.json | wc -l)
            
            echo "  - Tests found: $test_count"
            echo "  - Passed: $passed_count"
            echo "  - Failed: $failed_count"
          else
            echo "⚠ No test-results/results.json found"
          fi
          
          echo ""
          echo "=== 📊 Allure Results Directory ==="
          if [ -d "allure-results" ]; then
            result_files=$(find allure-results -type f | wc -l)
            echo "✓ allure-results directory exists with $result_files files"
            ls -lh allure-results/ | head -10
          else
            echo "⚠ No allure-results directory found"
          fi
          
          echo ""
          echo "=== 📈 Coverage Directory ==="
          ls -la coverage/ 2>/dev/null | head -10 || echo "No coverage directory"
          
          echo ""
          echo "=== 🎬 E2E Raw Coverage Files ==="
          if [ -d "coverage/e2e-raw" ]; then
            file_count=$(find coverage/e2e-raw -type f | wc -l)
            echo "✓ Found $file_count coverage files"
            du -sh coverage/e2e-raw/
          else
            echo "⚠ No e2e-raw directory"
          fi
          
          echo ""
          echo "=== 🎞️ Playwright Artifacts ==="
          [ -d "test-results" ] && echo "✓ test-results exists ($(find test-results -type f | wc -l) files)" || echo "⚠ test-results missing"
          [ -d "playwright-report" ] && echo "✓ playwright-report exists" || echo "⚠ playwright-report missing"

      - name: Upload frontend E2E raw coverage (early)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-raw-coverage-early
          path: frontend/coverage/e2e-raw
          retention-days: 14
          include-hidden-files: true
      - name: Generate Allure report
        if: always()
        working-directory: frontend
        run: |
          echo "=== Checking for allure-results ==="
          if [ -d "allure-results" ]; then
            result_count=$(ls -A allure-results 2>/dev/null | wc -l)
            echo "✓ Found allure-results directory with $result_count items"
          else
            echo "⚠ No allure-results directory found"
            mkdir -p allure-results
          fi
          
          # Generate Allure report if results exist
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "✓ Generating Allure report from results..."
            npx allure generate allure-results --clean -o allure-report
            
            # Verify report was generated
            if [ -f "allure-report/index.html" ]; then
              echo "✓ Allure report generated successfully"
            else
              echo "⚠ Allure report generation may have failed"
              mkdir -p allure-report
              echo "<h1>Allure report generation failed</h1><p>No test results were available.</p>" > allure-report/index.html
            fi
          else
            echo "⚠ No allure-results found, creating placeholder report..."
            mkdir -p allure-report
            cat > allure-report/index.html << 'PLACEHOLDER'
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Allure Report - No Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .warning { background-color: #fff3cd; padding: 15px; border: 1px solid #ffc107; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="warning">
        <h1>⚠️ Allure Report - No Test Results Available</h1>
        <p>The E2E test execution may have failed before generating results.</p>
        <p>Please check the workflow logs for more details.</p>
    </div>
</body>
</html>
PLACEHOLDER
          fi
          
          echo "=== Allure report verification ==="
          if [ -f "allure-report/index.html" ]; then
            echo "✓ Allure report index.html exists ($(wc -c < allure-report/index.html) bytes)"
          else
            echo "✗ Allure report index.html not found"
          fi

      - name: Generate frontend coverage report
        working-directory: frontend
        if: always()
        run: |
          echo "=== Before coverage:report ==="
          echo "Coverage directory contents:"
          ls -la coverage/e2e-raw/ 2>/dev/null | head -20 || echo "Directory is empty or missing"
          echo ""

          if [ -d "coverage/e2e-raw" ] && [ "$(ls -A coverage/e2e-raw)" ]; then
            echo "✓ Found coverage files, generating report..."

            # --------------------------------------------------
            # パス書き換え処理を追加:
            # コンテナ内の /app パスを CI 上の現在の絶対パス (例: /github/workspace/frontend) に置換
            # --------------------------------------------------
            sed -i "s|\"/app/|\"$(pwd)/|g" coverage/e2e-raw/*.json 2>/dev/null || true
            
            npm run coverage:report
          else
            echo "✗ No frontend coverage data found (coverage/e2e-raw is empty or missing)"
            mkdir -p coverage/e2e-report
            echo "<h1>No frontend coverage data available</h1>" > coverage/e2e-report/index.html
          fi

          echo ""
          echo "=== Coverage report verification ==="
          if [ -f coverage/e2e-report/index.html ]; then
            echo "✓ coverage/e2e-report/index.html exists ($(wc -c < coverage/e2e-report/index.html) bytes)"
          else
            echo "✗ Missing frontend coverage report: coverage/e2e-report/index.html"
            exit 1
          fi
          echo "Files in coverage/e2e-report:"
          find coverage/e2e-report -maxdepth 2 -type f | sort

      - name: Stop services and collect backend coverage
        if: always()
        working-directory: infra
        run: |
          docker compose -f docker-compose.ci.yml stop springboot
          sleep 3

      - name: Generate backend E2E coverage report
        if: always()
        working-directory: backend
        run: |
          if [ -f "../infra/jacoco-output/jacoco.exec" ]; then
            ./gradlew jacocoE2EReport
          else
            echo "No jacoco.exec found, skipping E2E coverage report"
          fi

      - name: Generate GitHub Pages site
        if: always()
        run: |
          mkdir -p gh-pages/allure gh-pages/coverage/frontend gh-pages/coverage/backend
          touch gh-pages/.nojekyll
          cat > gh-pages/index.html << 'HTML'
          <!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>Test App - Reports</title></head>
          <body><h1>📊 Test App - Reports</h1><ul>
          <li><a href="allure/index.html">📊 Allure E2E Test Report</a></li>
          <li><a href="coverage/index.html">📈 Coverage Reports</a></li>
          </ul></body></html>
          HTML
          cat > gh-pages/coverage/index.html << 'HTML'
          <!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>E2E Coverage Reports</title></head>
          <body><h1>📊 E2E Coverage Reports</h1><ul>
          <li><a href="frontend/index.html">🎨 Frontend Coverage</a></li>
          <li><a href="backend/index.html">☕ Backend Coverage</a></li>
          </ul><p><a href="../">← Back</a></p></body></html>
          HTML
          [ -f gh-pages/coverage/frontend/index.html ] || echo '<h1>No frontend coverage report available</h1>' > gh-pages/coverage/frontend/index.html
          [ -f gh-pages/coverage/backend/index.html ] || echo '<h1>No backend coverage report available</h1>' > gh-pages/coverage/backend/index.html

      - name: Copy reports to GitHub Pages
        if: always()
        run: |
          # Copy Allure report if available
          if [ -d "frontend/allure-report" ]; then
            echo "✓ Copying Allure report..."
            cp -r frontend/allure-report/. gh-pages/allure/
          else
            echo "⚠ No Allure report found, creating placeholder..."
            mkdir -p gh-pages/allure
            echo "<h1>No Allure report available</h1>" > gh-pages/allure/index.html
          fi

          # Copy frontend coverage if available
          mkdir -p gh-pages/coverage/frontend
          if [ -d "frontend/coverage/e2e-report" ] && [ "$(ls -A frontend/coverage/e2e-report)" ]; then
            echo "✓ Copying frontend coverage report..."
            cp -r frontend/coverage/e2e-report/. gh-pages/coverage/frontend/
          else
            echo "⚠ No frontend coverage found, creating placeholder..."
            echo "<h1>No frontend coverage data</h1>" > gh-pages/coverage/frontend/index.html
          fi

          # Copy backend coverage if available
          mkdir -p gh-pages/coverage/backend
          if [ -d "backend/build/reports/jacoco/jacocoE2EReport/html" ] && [ "$(ls -A backend/build/reports/jacoco/jacocoE2EReport/html)" ]; then
            echo "✓ Copying backend coverage report..."
            cp -r backend/build/reports/jacoco/jacocoE2EReport/html/. gh-pages/coverage/backend/
          else
            echo "⚠ No backend coverage found, creating placeholder..."
            echo "<h1>No backend E2E coverage data</h1>" > gh-pages/coverage/backend/index.html
          fi
          
          echo ""
          echo "=== DEBUG: Final gh-pages structure ==="
          echo "Total files in gh-pages: $(find gh-pages -type f | wc -l)"
          echo ""
          echo "=== DEBUG: gh-pages coverage/frontend contents ==="
          find gh-pages/coverage/frontend -maxdepth 2 -type f | sort
          echo ""
          echo "=== CRITICAL FILES CHECK ==="
          for file in "gh-pages/coverage/index.html" "gh-pages/coverage/frontend/index.html" "gh-pages/coverage/backend/index.html"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists ($(wc -c < $file) bytes)"
            else
              echo "✗ MISSING: $file"
            fi
          done

      - name: Upload test reports artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: gh-pages/
          retention-days: 14

      - name: Upload frontend E2E raw coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-raw-coverage
          path: frontend/coverage/e2e-raw
          retention-days: 14
          include-hidden-files: true

      - name: Deploy reports to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
          allow_empty_commit: true

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 5

      - name: Print container logs on failure
        if: always()
        working-directory: infra
        run: |
          echo "=== 🐛 Checking for errors and collecting logs ==="
          
          # Check if any service failed
          if docker compose -f docker-compose.ci.yml ps --services --filter "status=exited" 2>/dev/null | grep -q .; then
            echo "⚠️ Some services exited unexpectedly:"
            docker compose -f docker-compose.ci.yml ps --services --filter "status=exited"
          else
            echo "✓ All services still running or properly stopped"
          fi
          
          echo ""
          echo "=== 📝 Service Logs ==="
          
          echo ""
          echo "--- Moto (AWS Mock) Logs ---"
          docker compose -f docker-compose.ci.yml logs moto 2>/dev/null | tail -50 || echo "No moto logs available"
          
          echo ""
          echo "--- MySQL Logs (last 30 lines) ---"
          docker compose -f docker-compose.ci.yml logs mysql 2>/dev/null | tail -30 || echo "No MySQL logs available"
          
          echo ""
          echo "--- Spring Boot Logs (last 50 lines) ---"
          docker compose -f docker-compose.ci.yml logs springboot 2>/dev/null | tail -50 || echo "No Spring Boot logs available"
          
          echo ""
          echo "--- Frontend Logs (last 30 lines) ---"
          docker compose -f docker-compose.ci.yml logs frontend 2>/dev/null | tail -30 || echo "No frontend logs available"
          
          echo ""
          echo "=== 🔗 Service Health Check ==="
          docker compose -f docker-compose.ci.yml ps || echo "Could not get service status"

      - name: Report E2E test success
        if: always() && (env.E2E_EXIT_CODE == '0' || env.E2E_EXIT_CODE == '')
        run: |
          echo "=== E2E Test Result Check ==="
          echo "✓ E2E tests passed"

      - name: Report E2E test failure and fail job
        if: always() && env.E2E_EXIT_CODE != '' && env.E2E_EXIT_CODE != '0'
        run: |
          echo "=== E2E Test Result Check ==="
          echo "✗ E2E tests failed"
          echo ""
          echo "Note: All Allure reports and coverage reports have been generated."
          echo "Please check the workflow artifacts and GitHub Pages for details."
          exit 1

      - name: Stop Docker Compose services
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml down -v
