name: E2E Tests with Coverage

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JaCoCo agent from Gradle
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew copyJacocoAgent
          mkdir -p ../infra/jacoco ../infra/jacoco-output
          cp build/jacoco/jacocoagent.jar ../infra/jacoco/jacocoagent.jar

      - name: Start Docker Compose services
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        working-directory: infra
        timeout-minutes: 5
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null && break
            [ "$i" -eq 30 ] && { echo "MySQL failed"; exit 1; }
            sleep 3
          done

          echo "Waiting for Spring Boot..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "Spring Boot ready"; break; }
            [ "$i" -eq 60 ] && { docker compose -f docker-compose.ci.yml logs springboot; exit 1; }
            sleep 3
          done

          echo "Waiting for Frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 > /dev/null && { echo "Frontend ready"; break; }
            [ "$i" -eq 30 ] && { docker compose -f docker-compose.ci.yml logs frontend; exit 1; }
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (with JS coverage)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: npm run test:e2e

      - name: Generate Allure report
        if: always()
        working-directory: frontend
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found, skipping Allure report generation"
          fi

      - name: Generate frontend coverage report
        working-directory: frontend
        if: always()
        run: |
          if [ -d "coverage/e2e-raw" ] && [ "$(ls -A coverage/e2e-raw)" ]; then
            npm run coverage:report
          else
            echo "No frontend coverage data found (coverage/e2e-raw is empty or missing)"
            mkdir -p coverage/e2e-report
            echo "<h1>No frontend coverage data available</h1>" > coverage/e2e-report/index.html
          fi

      - name: Stop services and collect backend coverage
        if: always()
        working-directory: infra
        run: |
          docker compose -f docker-compose.ci.yml stop springboot
          sleep 3

      - name: Generate backend E2E coverage report
        if: always()
        working-directory: backend
        run: |
          if [ -f "../infra/jacoco-output/jacoco.exec" ]; then
            ./gradlew jacocoE2EReport
          else
            echo "No jacoco.exec found, skipping E2E coverage report"
          fi

      - name: Create GitHub Pages site
        if: always()
        run: |
          mkdir -p gh-pages/allure
          mkdir -p gh-pages/coverage/frontend
          mkdir -p gh-pages/coverage/backend
          
          # Create .nojekyll
          touch gh-pages/.nojekyll
          
          # Create main index.html using Python to avoid YAML/heredoc issues
          python3 << 'PYEOF'
import os
os.makedirs('gh-pages', exist_ok=True)

main_html = """<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>Test App - Reports</title>
<style>body{font-family:sans-serif;max-width:800px;margin:50px auto;line-height:1.6}h1{color:#333}.info{background:#f0f0f0;padding:15px;border-radius:5px;margin:20px 0}a{color:#0066cc;text-decoration:none}a:hover{text-decoration:underline}ul{list-style-type:none;padding:0}li{padding:8px 0}</style></head>
<body>
<h1>📊 Test App - Reports</h1>
<div class="info">
  <p><strong>📍 Location:</strong> This page is deployed to GitHub Pages</p>
  <p><strong>🔄 Updates:</strong> Reports are updated after each e2e test run on the main branch.</p>
</div>
<h2>📋 Available Reports</h2>
<ul>
  <li><a href="allure/index.html">📊 Allure E2E Test Report</a></li>
  <li><a href="coverage/index.html">📈 Coverage Reports</a></li>
</ul>
</body></html>"""

with open('gh-pages/index.html', 'w') as f:
    f.write(main_html)
print("✓ Main index.html created")

coverage_html = """<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>E2E Coverage Reports</title>
<style>body{font-family:sans-serif;max-width:800px;margin:50px auto;line-height:1.6}h1{color:#333}.info{background:#f0f0f0;padding:15px;border-radius:5px;margin:20px 0}a{color:#0066cc;text-decoration:none}a:hover{text-decoration:underline}ul{list-style-type:none;padding:0}li{padding:8px 0}</style></head>
<body>
<h1>📊 E2E Coverage Reports</h1>
<div class="info">
  <p><strong>📍 Location:</strong> <code>https://cocomomojo.github.io/test_app/coverage/</code></p>
  <p><strong>🔄 Updates:</strong> Reports are updated after each e2e test run on the main branch.</p>
</div>
<h2>Reports</h2>
<ul>
  <li><a href="frontend/index.html">🎨 Frontend Coverage (Playwright + Istanbul)</a></li>
  <li><a href="backend/index.html">☕ Backend Coverage (JaCoCo)</a></li>
</ul>
<p><a href="../">← Back to main page</a></p>
</body></html>"""

with open('gh-pages/coverage/index.html', 'w') as f:
    f.write(coverage_html)
print("✓ Coverage index.html created")

# Verify
if os.path.exists('gh-pages/coverage/index.html'):
    size = os.path.getsize('gh-pages/coverage/index.html')
    print(f"✓ VERIFIED: gh-pages/coverage/index.html exists ({size} bytes)")
else:
    print("✗ ERROR: gh-pages/coverage/index.html was NOT created!")
    exit(1)
PYEOF
          
          echo ""
          echo "=== Files created in gh-pages ==="
          ls -la gh-pages/

      - name: Copy reports to GitHub Pages
        if: always()
        run: |
          # Copy Allure report if available
          if [ -d "frontend/allure-report" ]; then
            echo "✓ Copying Allure report..."
            cp -r frontend/allure-report/. gh-pages/allure/
          else
            echo "⚠ No Allure report found, creating placeholder..."
            echo "<h1>No Allure report available</h1>" > gh-pages/allure/index.html
          fi

          # Copy frontend coverage if available
          if [ -d "frontend/coverage/e2e-report" ]; then
            echo "✓ Copying frontend coverage report..."
            cp -r frontend/coverage/e2e-report/. gh-pages/coverage/frontend/
          else
            echo "⚠ No frontend coverage found, creating placeholder..."
            echo "<h1>No frontend coverage data</h1>" > gh-pages/coverage/frontend/index.html
          fi

          # Copy backend coverage if available
          if [ -d "backend/build/reports/jacoco/jacocoE2EReport/html" ]; then
            echo "✓ Copying backend coverage report..."
            cp -r backend/build/reports/jacoco/jacocoE2EReport/html/. gh-pages/coverage/backend/
          else
            echo "⚠ No backend coverage found, creating placeholder..."
            echo "<h1>No backend E2E coverage data</h1>" > gh-pages/coverage/backend/index.html
          fi
          
          echo ""
          echo "=== DEBUG: Final gh-pages structure ==="
          echo "Total files in gh-pages: $(find gh-pages -type f | wc -l)"
          echo ""
          echo "=== CRITICAL FILES CHECK ==="
          for file in "gh-pages/coverage/index.html" "gh-pages/coverage/frontend/index.html" "gh-pages/coverage/backend/index.html"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists ($(wc -c < $file) bytes)"
            else
              echo "✗ MISSING: $file"
            fi
          done

      - name: Upload test reports artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: gh-pages/
          retention-days: 14

      - name: Deploy reports to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
          allow_empty_commit: true

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 5

      - name: Print container logs on failure
        if: failure()
        working-directory: infra
        run: |
          echo "=== Moto logs ==="
          docker compose -f docker-compose.ci.yml logs moto || true
          echo "=== MySQL logs ==="
          docker compose -f docker-compose.ci.yml logs mysql || true
          echo "=== Spring Boot logs ==="
          docker compose -f docker-compose.ci.yml logs springboot || true
          echo "=== Frontend logs ==="
          docker compose -f docker-compose.ci.yml logs frontend || true

      - name: Stop Docker Compose services
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml down -v
