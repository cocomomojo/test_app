---
name: Weekly Feature Fix with Retry

# 【重要】このワークフローについて：
# 1. 毎週スケジュール実行で、feature ラベル付きの未解決Issue を自動修正します
# 2. E2E テスト失敗と重複について：
#    - E2E テスト失敗時は e2e-failure-analysis.yml が別途 Issue を作成します（修正しない）
#    - 本ワークフローは feature ラベル付きの既存Issue を自動修正します
#    - よって重複は発生しません（e2e失敗Issue と feature修正Issue は別ラベル）
# 3. PR Quality Checks 内での E2E 失敗：
#    - e2e-failure-analysis.yml が e2e トラブル用の新Issue を作成
#    - 本ワークフローは feature ラベル Issue のみ修正
#    - 重複しないメカニズム: ラベルの分離 (feature vs. e2e-test-failure など)

on:
  schedule:
    # 毎週月曜日 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      issue_number:
        description: >-
          修正対象のIssue番号（指定されない場合は
          最新のFEATUREラベル付きIssueを使用）
        required: false
        type: string

permissions:
  issues: write
  contents: write
  actions: write
  pull-requests: write

jobs:
  find-feature-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.find_issue.outputs.issue_number }}
      issue_title: ${{ steps.find_issue.outputs.issue_title }}
      found: ${{ steps.find_issue.outputs.found }}
    steps:
      - name: Find latest feature issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatchで指定されたissue_numberがあれば使用
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            echo "Using specified issue: $ISSUE_NUMBER"
          else
            # 最新のOpen状態でfeatureラベル付きのIssueを取得
            # GitHub CLI --search オプションは複雑なクエリに対応していないため、
            # --label と --state を使用して単純にフィルタリング
            ISSUE_NUMBER=$(gh issue list \
              --label feature --state open \
              --json number -q '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No feature issue found"
            exit 0
          fi

          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" \
            --json title -q '.title' 2>/dev/null || echo "")

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_title=$ISSUE_TITLE" >> "$GITHUB_OUTPUT"
          echo "Found feature issue: #$ISSUE_NUMBER - $ISSUE_TITLE"

  fix-issue-with-retry:
    needs: find-feature-issue
    if: needs.find-feature-issue.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 1
    env:
      ISSUE_NUMBER: ${{ needs.find-feature-issue.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.find-feature-issue.outputs.issue_title }}
      MAX_RETRIES: 3
      COPILOT_AGENT_RUNNER_TYPE: STANDALONE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Initialize retry counter
        id: init
        run: |
          # コメントから前回の実行回数をチェック
          RETRY_COUNT=0
          COMMENTS=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            -q '.[].body' 2>/dev/null || echo "")

          # 直前のコメントから回数を抽出
          if echo "$COMMENTS" | grep -q "weekly-feature-fix-retry"; then
            LAST_COUNT=$(echo "$COMMENTS" | grep "weekly-feature-fix-retry" | \
              tail -1 | grep -oP 'retry_count=\K[0-9]+' || echo "0")
            RETRY_COUNT=$((LAST_COUNT + 1))
          fi

          echo "retry_count=$RETRY_COUNT" >> "$GITHUB_OUTPUT"
          echo "Retry count: $RETRY_COUNT"

          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "exceeded_max=true" >> "$GITHUB_OUTPUT"
          else
            echo "exceeded_max=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if max retries exceeded
        if: steps.init.outputs.exceeded_max == 'true'
        run: |
          echo "Max retries ($MAX_RETRIES) exceeded. Giving up."

      - name: Comment issue - Retry started
        if: steps.init.outputs.exceeded_max == 'false'
        uses: actions/github-script@v7
        env:
          RETRY_COUNT: ${{ steps.init.outputs.retry_count }}
        with:
          script: |
            const marker = '<!-- weekly-feature-fix-retry -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const retryCount = Number(process.env.RETRY_COUNT);

            const body = [
              marker,
              `### 🔧 Weekly Feature Fix (Attempt ${retryCount + 1}/${process.env.MAX_RETRIES})`,
              '',
              `- retry_count=${retryCount}`,
              `- status=started`,
              `- timestamp=${new Date().toISOString()}`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              (comment.body || '').includes(marker) &&
              (comment.body || '').includes(`retry_count=${retryCount}`)
            );

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Setup Node.js
        if: steps.init.outputs.exceeded_max == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch issue details
        if: steps.init.outputs.exceeded_max == 'false'
        id: issue_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/feature-fix
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels > /tmp/feature-fix/issue.json

          echo "=== DEBUG: Issue fetched from GitHub ==="
          cat /tmp/feature-fix/issue.json
           
          echo ""
          echo "=== DEBUG: Checking fields ==="
          TITLE=$(jq -r '.title' /tmp/feature-fix/issue.json 2>/dev/null || echo "ERROR")
          BODY=$(jq -r '.body' /tmp/feature-fix/issue.json 2>/dev/null || echo "ERROR")
          echo "Title: '$TITLE'"
          echo "Body length: ${#BODY}"
          echo "Body first 300 chars: ${BODY:0:300}"
          echo "=== END DEBUG ==="

      - name: Generate fix brief
        if: steps.init.outputs.exceeded_max == 'false'
        run: |
          if [ -f scripts/issue-tools.js ]; then
            node scripts/issue-tools.js classify \
              --issue-file /tmp/feature-fix/issue.json \
              --repo "$GITHUB_REPOSITORY" \
              --out /tmp/feature-fix/triage.json || true

            node scripts/issue-tools.js generate-fix-brief \
              --issue-file /tmp/feature-fix/issue.json \
              --triage-file /tmp/feature-fix/triage.json \
              --out-dir /tmp/feature-fix/output || true
          else
            echo "scripts/issue-tools.js not found"
          fi

      - name: Setup GitHub Copilot CLI
        if: steps.init.outputs.exceeded_max == 'false'
        uses: github/gh-aw/actions/setup@466b8ad27fcfaaa861da3f16ba7c01272df25f46
        with:
          destination: /opt/gh-aw/actions

      - name: Install GitHub Copilot CLI
        if: steps.init.outputs.exceeded_max == 'false'
        run: /opt/gh-aw/actions/install_copilot_cli.sh 0.0.421

      - name: Validate COPILOT_GITHUB_TOKEN secret
        if: steps.init.outputs.exceeded_max == 'false'
        run: /opt/gh-aw/actions/validate_multi_secret.sh COPILOT_GITHUB_TOKEN \
          'GitHub Copilot CLI' \
          https://github.github.com/gh-aw/reference/engines/#github-copilot-default
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Parse issue details into structured format
        if: steps.init.outputs.exceeded_max == 'false'
        run: |
          python3 << 'PARSE_SCRIPT'
          import json
          import re
          from pathlib import Path

          # Load issue data
          issue_data = json.loads(Path('/tmp/feature-fix/issue.json').read_text())
          issue_body = issue_data.get('body', '')

          # Parse issue sections
          sections = {
              'background': '',
              'feature_description': '',
              'acceptance_criteria': [],
              'estimated_effort': ''
          }

          current_section = None
          lines = issue_body.split('\n')

          for line in lines:
              if line.strip().startswith('## '):
                  section_name = line.replace('##', '').strip().lower()
                  if 'background' in section_name:
                      current_section = 'background'
                  elif 'description' in section_name or 'feature' in section_name:
                      current_section = 'feature_description'
                  elif 'acceptance' in section_name or 'criteria' in section_name:
                      current_section = 'acceptance_criteria'
                  elif 'effort' in section_name:
                      current_section = 'estimated_effort'
              elif current_section and line.strip() and not line.startswith('##'):
                  if current_section == 'acceptance_criteria':
                      if line.strip().startswith('- ['):
                          # Extract criterion text after checkbox
                          criterion = re.sub(r'^- \[[^\]]*\]\s*', '', line.strip())
                          if criterion:
                              sections['acceptance_criteria'].append(criterion)
                  elif current_section == 'estimated_effort':
                      sections[current_section] = line.strip()
                  else:
                      if sections[current_section]:
                          sections[current_section] += '\n'
                      sections[current_section] += line

          # Save parsed sections
          with open('/tmp/feature-fix/parsed_issue.json', 'w') as f:
              json.dump(sections, f, ensure_ascii=False, indent=2)

          print("✓ Issue sections parsed successfully")
          print(f"  Background length: {len(sections['background'])}")
          print(f"  Feature description length: {len(sections['feature_description'])}")
          print(f"  Acceptance criteria count: {len(sections['acceptance_criteria'])}")
          print(f"  Effort: {sections['estimated_effort']}")
          PARSE_SCRIPT

      - name: Generate fix prompt
        if: steps.init.outputs.exceeded_max == 'false'
        id: generate_prompt
        run: |
          mkdir -p /tmp/feature-fix/output

          # Load parsed issue sections
          python3 << 'LOAD_PARSED'
          import json
          from pathlib import Path

          parsed = json.loads(Path('/tmp/feature-fix/parsed_issue.json').read_text())
          with open('/tmp/feature-fix/issue-background.txt', 'w') as f:
              f.write(parsed.get('background', '').strip())
          with open('/tmp/feature-fix/issue-description.txt', 'w') as f:
              f.write(parsed.get('feature_description', '').strip())
          with open('/tmp/feature-fix/issue-criteria.txt', 'w') as f:
              criteria = parsed.get('acceptance_criteria', [])
              f.write('\n'.join(f'- {c}' for c in criteria))
          LOAD_PARSED

          # Read parsed sections
          ISSUE_TITLE=$(jq -r '.title' /tmp/feature-fix/issue.json)
          ISSUE_BACKGROUND=$(cat /tmp/feature-fix/issue-background.txt)
          ISSUE_DESCRIPTION=$(cat /tmp/feature-fix/issue-description.txt)
          ISSUE_CRITERIA=$(cat /tmp/feature-fix/issue-criteria.txt)

          cat > /tmp/feature-fix/output/prompt.txt << 'PROMPT_EOF'
          【重要】すべての応答と実装は日本語で行ってください。

          あなたはフルスタックアプリケーション（Vue 3 + Spring Boot）の機能を実装するスキルの高いソフトウェア開発者です。

          ## プロジェクト構成
          - **Frontend**: Vue 3 + Vuetify 3 + TypeScript (frontend/ ディレクトリ)
          - **Backend**: Spring Boot 3 + Java 17 (backend/ ディレクトリ)
          - **テスト**: Vitest (フロントエンド), JUnit 5 (バックエンド), Playwright (E2E)

          ## 実装ガイドライン
          ⚠️ 以下の点を常に確認してください：
          1. **実装可能性の判定**: この要件は実装可能ですか？修正するファイルが明確に特定できますか？
          2. **フロント/バックの判定**: Frontend のみ/Backend のみ/両方のどれが必要ですか？
          3. **ファイル修正対象**: どのファイルを修正する必要があるか具体的に列挙してください
          4. **差分が絶対条件**: 実装後、確実に git diff で差分が表示されること

          PROMPT_EOF

          echo "## 実装要件" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "### タイトル" >> /tmp/feature-fix/output/prompt.txt
          echo "$ISSUE_TITLE" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "### 背景" >> /tmp/feature-fix/output/prompt.txt
          echo "$ISSUE_BACKGROUND" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "### 機能説明" >> /tmp/feature-fix/output/prompt.txt
          echo "$ISSUE_DESCRIPTION" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "### 受け入れ条件（実装必須）" >> /tmp/feature-fix/output/prompt.txt
          echo "$ISSUE_CRITERIA" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "## 実装タスク" >> /tmp/feature-fix/output/prompt.txt
          echo "1. 受け入れ条件を注意深く確認し、実装可能か判定する" >> /tmp/feature-fix/output/prompt.txt
          echo "2. Frontend/Backend の修正対象ファイルを特定する" >> /tmp/feature-fix/output/prompt.txt
          echo "3. 修正が必要なファイルのリストを作成してから実装を開始する" >> /tmp/feature-fix/output/prompt.txt
          echo "4. コードを実装する（テストコードを含む）" >> /tmp/feature-fix/output/prompt.txt
          echo "5. すべてのテストが成功することを確認する" >> /tmp/feature-fix/output/prompt.txt
          echo "6. 受け入れ条件がすべて満たされたことを検証する" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "## 【重要】ブランチング手順" >> /tmp/feature-fix/output/prompt.txt
          echo "⚠️ mainブランチへの変更は厳禁です！" >> /tmp/feature-fix/output/prompt.txt
          echo "1. 最初に、この正確なコマンドで新しいフィーチャーブランチを作成してください:" >> /tmp/feature-fix/output/prompt.txt
          echo "   git checkout -b copilot/issue-${ISSUE_NUMBER}" >> /tmp/feature-fix/output/prompt.txt
          echo "2. 変更を加える前にフィーチャーブランチにいることを確認してください" >> /tmp/feature-fix/output/prompt.txt
          echo "3. すべてのコード変更はこのフィーチャーブランチでのみ行ってください" >> /tmp/feature-fix/output/prompt.txt
          echo "4. 修正されたすべてのファイルをステージしてください: git add ." >> /tmp/feature-fix/output/prompt.txt
          echo "5. わかりやすいメッセージでコミットしてください" >> /tmp/feature-fix/output/prompt.txt
          echo "6. この正確なコマンドでフィーチャーブランチにのみプッシュしてください:" >> /tmp/feature-fix/output/prompt.txt
          echo "   git push origin copilot/issue-${ISSUE_NUMBER}" >> /tmp/feature-fix/output/prompt.txt
          echo "7. 絶対にmainブランチにはプッシュしないでください" >> /tmp/feature-fix/output/prompt.txt
          echo "8. ワークフローが自動的にプルリクエストを作成します" >> /tmp/feature-fix/output/prompt.txt
            
          echo ""
          echo "=== DEBUG: Generated prompt (first 800 chars) ==="
          head -c 800 /tmp/feature-fix/output/prompt.txt
          echo ""
          echo "=== END DEBUG ==="

          echo "prompt_generated=true" >> "$GITHUB_OUTPUT"

      - name: Configure git for Copilot execution
        if: steps.init.outputs.exceeded_max == 'false' &&
            steps.generate_prompt.outputs.prompt_generated == 'true'
        run: |
          # git push実行時にCOPILOT_GITHUB_TOKENを使用するよう設定
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.COPILOT_GITHUB_TOKEN }}@github.com" > ~/.git-credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute GitHub Copilot for implementation
        if: steps.init.outputs.exceeded_max == 'false' &&
            steps.generate_prompt.outputs.prompt_generated == 'true'
        id: copilot_exec
        continue-on-error: true
        run: |
          /usr/local/bin/copilot \
            --add-dir "${GITHUB_WORKSPACE}" \
            --add-dir "/tmp/feature-fix" \
            --disable-builtin-mcps \
            --allow-all-tools \
            --allow-all-paths \
            --prompt "$(cat /tmp/feature-fix/output/prompt.txt)"
        env:
          COPILOT_AGENT_RUNNER_TYPE: ${{ env.COPILOT_AGENT_RUNNER_TYPE }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: /home/runner

      - name: Validate syntax for modified files
        if: steps.init.outputs.exceeded_max == 'false' &&
            steps.copilot_exec.outcome == 'success'
        id: syntax_check
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"
          echo "🔍 Starting syntax validation..."
            
          SYNTAX_ERRORS=""
          YAML_ERRORS=""
          JS_ERRORS=""
          TS_ERRORS=""
           
          # Install yamllint if not available
          if ! command -v yamllint &> /dev/null; then
            echo "📦 Installing yamllint..."
            pip install yamllint -q
          fi
           
          # Check YAML files in .github/workflows/
          echo "✅ Checking YAML workflow files..."
          YAML_FILES=$( { git diff --name-only origin/main HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ""; } | grep -E '\.github/workflows/.*\.yml$' || true)
           
          if [ -n "$YAML_FILES" ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "  Validating: $file"
                if ! yamllint -d '{rules: {line-length: disable, comments: disable, truthy: disable, document-start: disable}}' "$file" 2>/dev/null; then
                  YAML_ERRORS="${YAML_ERRORS}❌ YAML Syntax Error in $file\n"
                fi
              fi
            done <<< "$YAML_FILES"
          fi
           
          # Check JavaScript files
          echo "✅ Checking JavaScript files..."
          JS_FILES=$( { git diff --name-only origin/main HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ""; } | grep -E '\.(js|jsx)$' || true)
           
          if [ -n "$JS_FILES" ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "  Validating: $file"
                if ! node -c "$file" 2>/dev/null; then
                  JS_ERRORS="${JS_ERRORS}❌ JavaScript Syntax Error in $file\n"
                fi
              fi
            done <<< "$JS_FILES"
          fi
           
          # Check TypeScript files
          echo "✅ Checking TypeScript files..."
          TS_FILES=$( { git diff --name-only origin/main HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ""; } | grep -E '\.(ts|tsx)$' || true)
           
          if [ -n "$TS_FILES" ]; then
            # Setup tsconfig check if needed
            if [ -f "frontend/tsconfig.json" ] || [ -f "tsconfig.json" ]; then
              echo "  Found TypeScript configuration, validating..."
              while IFS= read -r file; do
                if [ -f "$file" ]; then
                  echo "  Validating: $file"
                  if ! npx tsc --noEmit "$file" 2>/dev/null; then
                    # Check if it's a legitimate TS error or just missing type definitions
                    # For now, report the error but note that it might be a type issue
                    TS_ERRORS="${TS_ERRORS}⚠️ TypeScript Type/Syntax Issue in $file\n"
                  fi
                fi
              done <<< "$TS_FILES"
            else
              echo "  No TypeScript configuration found, skipping TS validation"
            fi
          fi
           
          # Output results
          if [ -n "$YAML_ERRORS" ] || [ -n "$JS_ERRORS" ] || [ -n "$TS_ERRORS" ]; then
            echo -e "\n⚠️ Syntax validation found issues:"
            if [ -n "$YAML_ERRORS" ]; then
              echo -e "YAML Issues:\n$YAML_ERRORS"
            fi
            if [ -n "$JS_ERRORS" ]; then
              echo -e "JavaScript Issues:\n$JS_ERRORS"
            fi
            if [ -n "$TS_ERRORS" ]; then
              echo -e "TypeScript Issues:\n$TS_ERRORS"
            fi
            SYNTAX_ERRORS="${YAML_ERRORS}${JS_ERRORS}${TS_ERRORS}"
          else
            echo "✅ All modified files passed syntax validation!"
          fi
           
          # Store result for later use
          echo "syntax_check_status=$([ -n "$SYNTAX_ERRORS" ] && echo "failed" || echo "success")" >> "$GITHUB_OUTPUT"
          echo "syntax_errors<<SYNTAXEOF" >> "$GITHUB_OUTPUT"
          echo -e "$SYNTAX_ERRORS" >> "$GITHUB_OUTPUT"
          echo "SYNTAXEOF" >> "$GITHUB_OUTPUT"

      - name: Check and push feature branch
        if: steps.init.outputs.exceeded_max == 'false' &&
            steps.copilot_exec.outcome == 'success'
        id: push_branch
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"
           
          BRANCH_NAME="copilot/issue-${ISSUE_NUMBER}"
           
          # ローカルブランチの存在確認
          if ! git rev-parse "$BRANCH_NAME" > /dev/null 2>&1; then
            echo "❌ Local branch does not exist: $BRANCH_NAME"
            echo "Available branches:"
            git branch -a
            echo "git_push_status=local_branch_not_found" >> "$GITHUB_OUTPUT"
            exit 1
          fi
           
          echo "✅ Local branch exists: $BRANCH_NAME"
           
          # git push を実行（エラーをキャプチャ）
          echo "📤 Attempting to push branch to remote..."
          GIT_PUSH_OUTPUT=$( { git push origin "$BRANCH_NAME" -f 2>&1; } )
          GIT_PUSH_EXIT_CODE=$?
           
          echo "$GIT_PUSH_OUTPUT"
           
          if [ $GIT_PUSH_EXIT_CODE -eq 0 ]; then
            echo "✅ Git push succeeded"
            echo "git_push_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Git push failed with exit code $GIT_PUSH_EXIT_CODE"
            echo "git_push_status=failed" >> "$GITHUB_OUTPUT"
             
            # エラータイプを分類
            if echo "$GIT_PUSH_OUTPUT" | grep -qE '(401|Authentication failed|Unauthorized)'; then
              echo "git_push_error_type=authentication_failed" >> "$GITHUB_OUTPUT"
            elif echo "$GIT_PUSH_OUTPUT" | grep -qE '(403|Permission denied|Forbidden)'; then
              echo "git_push_error_type=permission_denied" >> "$GITHUB_OUTPUT"
            elif echo "$GIT_PUSH_OUTPUT" | grep -qE '(connection refused|timeout|Connection timed out)'; then
              echo "git_push_error_type=network_error" >> "$GITHUB_OUTPUT"
            else
              echo "git_push_error_type=unknown_error" >> "$GITHUB_OUTPUT"
            fi
             
            # ログを保存
            echo "$GIT_PUSH_OUTPUT" > /tmp/git_push_error.log
            exit 1
          fi

      - name: Fetch and checkout feature branch
        if: steps.init.outputs.exceeded_max == 'false'
        id: checkout_feature
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"
           
          BRANCH_NAME="copilot/issue-${ISSUE_NUMBER}"
           
          # Fetch the latest from remote to ensure we have the feature branch
          git fetch origin "$BRANCH_NAME" 2>/dev/null || {
            echo "⚠️ Feature branch not found in remote, continuing with current state"
            exit 0
          }
           
          # Checkout the feature branch
          git checkout "$BRANCH_NAME" 2>/dev/null || {
            echo "⚠️ Could not checkout feature branch, continuing with current state"
            exit 0
          }
           
          echo "✅ Successfully checked out feature branch: $BRANCH_NAME"
          echo "branch_checked_out=true" >> "$GITHUB_OUTPUT"

      - name: Detect changes early (before tests)
        if: steps.init.outputs.exceeded_max == 'false'
        id: early_changes
        run: |
          cd "${GITHUB_WORKSPACE}"
             
          # Check for any changes:
          # 1. Uncommitted/untracked changes in working directory
          # 2. Commits made on current branch that differ from main
           
          HAS_UNCOMMITTED=false
          HAS_COMMITS=false
           
          # Check for uncommitted changes (modified, added, deleted, untracked files)
          if git status --porcelain | grep -q .; then
            HAS_UNCOMMITTED=true
          fi
           
          # Check for commits made on current branch (vs. main)
          # git diff origin/main..HEAD returns non-zero if there are differences
          if ! git diff --quiet origin/main..HEAD 2>/dev/null; then
            HAS_COMMITS=true
          fi
           
          # If either uncommitted changes or new commits exist, we have changes
          if [ "$HAS_UNCOMMITTED" = "true" ] || [ "$HAS_COMMITS" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "✅ Changes detected (uncommitted=$HAS_UNCOMMITTED, commits=$HAS_COMMITS) - will run tests"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No changes detected - skipping tests"
          fi

      - name: Run tests
        if: steps.init.outputs.exceeded_max == 'false' && steps.early_changes.outputs.has_changes == 'true'
        id: test_exec
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"

          # frontend tests
          if [ -d frontend ]; then
            cd frontend
            npm ci 2>/dev/null || true
            npm run build 2>/dev/null || true
            npx vitest run 2>/dev/null || true
            cd "${GITHUB_WORKSPACE}"
          fi

          # backend tests (if applicable)
          if [ -f requirements.txt ]; then
            python -m pytest 2>/dev/null || true
          fi

          echo "Tests completed"

      - name: Collect debug information after Copilot execution
        if: steps.init.outputs.exceeded_max == 'false'
        id: debug_info
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Copilot execution status
          COPILOT_EXIT_CODE=${{ steps.copilot_exec.outcome }}
          echo "Copilot execution outcome: $COPILOT_EXIT_CODE"

          # Save git status
          echo "=== Collecting Git Status ===" >&2
          GIT_STATUS=$(git status --porcelain)
          GIT_STATUS_SHORT=$(git status --short)
           
          # Save git log
          echo "=== Latest Commits ===" >&2
          GIT_LOG=$(git log --oneline -5)
           
          # Save changed files
          echo "=== Changed Files ===" >&2
          CHANGED_FILES=$(git diff --name-only)
          STAGED_FILES=$(git diff --cached --name-only)
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
           
          # Save diff stats
          echo "=== Diff Statistics ===" >&2
          DIFF_STAT=$(git diff --stat || echo "No diffs")
           
          # Count changes
          MODIFIED_COUNT=$(echo "$GIT_STATUS" | grep "^ M" | wc -l)
          ADDED_COUNT=$(echo "$GIT_STATUS" | grep "^A" | wc -l)
          DELETED_COUNT=$(echo "$GIT_STATUS" | grep "^ D" | wc -l)
          UNTRACKED_COUNT=$(echo "$GIT_STATUS" | grep "^??" | wc -l)
           
          # Store debug information in outputs
          {
            echo "debug_info<<DEBUGEOF"
            echo "## 🔍 Debug Information - Copilot Execution Report"
            echo ""
            echo "### Execution Status"
            echo "- Copilot Exit Code: $COPILOT_EXIT_CODE"
            echo "- Test Outcome: ${{ steps.test_exec.outcome }}"
            echo ""
            echo "### Change Summary"
            echo "- Modified Files: $MODIFIED_COUNT"
            echo "- Added Files: $ADDED_COUNT"
            echo "- Deleted Files: $DELETED_COUNT"
            echo "- Untracked Files: $UNTRACKED_COUNT"
            echo ""
            if [ -n "$CHANGED_FILES" ]; then
              echo "### Modified Files"
              echo "\`\`\`"
              echo "$CHANGED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            if [ -n "$STAGED_FILES" ]; then
              echo "### Staged Files"
              echo "\`\`\`"
              echo "$STAGED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            if [ -n "$UNTRACKED_FILES" ]; then
              echo "### Untracked Files"
              echo "\`\`\`"
              echo "$UNTRACKED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            echo "### Git Status (porcelain)"
            echo "\`\`\`"
            if [ -n "$GIT_STATUS" ]; then
              echo "$GIT_STATUS"
            else
              echo "(no changes)"
            fi
            echo "\`\`\`"
            echo ""
            echo "### Git Log (recent commits)"
            echo "\`\`\`"
            echo "$GIT_LOG"
            echo "\`\`\`"
            echo ""
            echo "### Diff Statistics"
            echo "\`\`\`"
            echo "$DIFF_STAT"
            echo "\`\`\`"
            echo "DEBUGEOF"
          } >> "$GITHUB_OUTPUT"
           
          echo "Debug info collected successfully"

      - name: Detect changes and prepare PR metadata
        if: steps.init.outputs.exceeded_max == 'false' && steps.early_changes.outputs.has_changes == 'true' && steps.test_exec.outcome == 'success'
        id: pr_meta
        run: |
          cd "${GITHUB_WORKSPACE}"

          # デバッグログ：ファイルの状態を確認
          echo "=== Git Status ===" >&2
          git status --porcelain
          echo "" >&2
            
          echo "=== Git Diff Summary ===" >&2
          git diff --stat || echo "No changes in git diff"
          echo "" >&2
            
          echo "=== Untracked Files ===" >&2
          git status --short | grep "^??" || echo "No untracked files"
          echo "" >&2

          # チェンジをチェック：
          # 1. 未追跡ファイルを含む作業ディレクトリの変更
          # 2. 現在のブランチとmainブランチの差分
           
          HAS_UNCOMMITTED=false
          HAS_COMMITS=false
           
          if git status --porcelain | grep -q .; then
            HAS_UNCOMMITTED=true
          fi
           
          if ! git diff --quiet origin/main..HEAD 2>/dev/null; then
            HAS_COMMITS=true
          fi
           
          if [ "$HAS_UNCOMMITTED" = "true" ] || [ "$HAS_COMMITS" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR メタデータを生成
          BRANCH_NAME="copilot/issue-${ISSUE_NUMBER}"
          PR_TITLE="feat: Implement feature for issue #${ISSUE_NUMBER}"
          PR_COMMIT_MSG="feat: auto-implement issue #${ISSUE_NUMBER}"

          printf 'branch_name=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          printf 'pr_title=%s\n' "$PR_TITLE" >> "$GITHUB_OUTPUT"
          printf 'commit_message=%s\n' "$PR_COMMIT_MSG" >> "$GITHUB_OUTPUT"

          echo "PR metadata prepared: branch=$BRANCH_NAME"

      - name: Generate PR description
        if: steps.pr_meta.outputs.has_changes == 'true'
        id: pr_desc
        run: |
          mkdir -p /tmp/feature-fix/pr

          # Use Python to safely generate PR description with multiline content
          python3 << 'PYTHON_EOF'
          import json
          from datetime import datetime

          with open('/tmp/feature-fix/issue.json') as f:
              issue = json.load(f)

          title = issue.get('title', 'N/A')
          body = issue.get('body', '')
          html_url = issue.get('html_url', 'N/A')
          timestamp = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # Get test result status from environment
          test_outcome = '''${{ steps.test_exec.outcome }}'''
          test_status = '[x] Tests passed' if test_outcome == 'success' else '[✗] Tests failed'
           
          lines = [
              '## 🤖 Auto-generated PR',
              '',
              'This PR was automatically created by GitHub Copilot to address the feature request.',
              '',
              '### Original Issue',
              '',
              f'**Title:** {title}',
              '',
              f'**Issue:** {html_url}',
              '',
              '### Description',
              '',
              body,
              '',
              '### Checklist',
              '',
              '- [x] Implementation completed',
              f'- {test_status}',
              '- [ ] Ready for review',
              '',
              '---',
              '',
              f'Generated by Copilot on {timestamp}'
          ]

          with open('/tmp/feature-fix/pr/description.md', 'w') as f:
              f.write('\n'.join(lines))
          PYTHON_EOF

          echo "pr_body_path=/tmp/feature-fix/pr/description.md" >> "$GITHUB_OUTPUT"

      - name: Report no changes detected
        if: steps.pr_meta.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        env:
          DEBUG_INFO: ${{ steps.debug_info.outputs.debug_info }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const debugInfo = process.env.DEBUG_INFO || '詳細なデバッグ情報は利用できません';

            const comment = [
              '<!-- weekly-feature-fix-no-changes -->',
              '## ⚠️ 変更が検出されません',
              '',
              'Copilot ワークフローは正常に完了し、すべてのテストに合格しましたが、コード変更は検出されませんでした。',
              '',
              debugInfo,
              '',
              '### 次のステップの候補:',
              '- [ ] Issue の要件が明確であることを確認する',
              '- [ ] この機能が既に実装されていないか確認する',
              '- [ ] Copilot 実行ログを確認する（GitHub Actions タブ）',
              '- [ ] 機能を手動で実装する',
              '- [ ] Issue の説明をより具体的な要件で更新する',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
            } catch (error) {
              core.warning(`Failed to create comment: ${error.message}`);
            }

      - name: Verify branch pushed to remote
        if: steps.pr_meta.outputs.has_changes == 'true'
        id: verify_push
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"
          BRANCH_NAME="${{ steps.pr_meta.outputs.branch_name }}"
           
          echo "🔍 Checking if branch '$BRANCH_NAME' exists on remote..."
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "✅ Branch exists on remote"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Branch does not exist on remote yet"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Fetch latest from remote
        if: steps.pr_meta.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"
          BRANCH_NAME="${{ steps.pr_meta.outputs.branch_name }}"
           
          echo "📥 Fetching branch '$BRANCH_NAME' from remote..."
          git fetch origin "$BRANCH_NAME" --force || {
            echo "⚠️ Fetch failed, but continuing..."
            exit 0
          }
           
          echo "✅ Fetch completed"
          git show-ref refs/remotes/origin/"$BRANCH_NAME" || echo "ℹ️ Local ref not updated yet"

      - name: Create pull request
        id: create_pr
        if: steps.pr_meta.outputs.has_changes == 'true' && steps.verify_push.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.pr_meta.outputs.branch_name }}
          PR_TITLE: ${{ steps.pr_meta.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.pr_desc.outputs.pr_body_path }}
        run: |
          cd "${GITHUB_WORKSPACE}"
           
          echo "📋 Checking if PR already exists for branch: $BRANCH_NAME"
           
          # PR が既に存在するか確認
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
           
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR already exists: #$EXISTING_PR"
            echo "number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "pull-request-operation=updated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
           
          echo "📝 Creating new PR for branch: $BRANCH_NAME"
           
          # PR 本文ファイルが存在するか確認
          if [ ! -f "$PR_BODY_FILE" ]; then
            echo "⚠️ PR body file not found: $PR_BODY_FILE"
            echo "Using default body"
            PR_BODY="Auto-generated PR for implementation"
          else
            PR_BODY=$(cat "$PR_BODY_FILE")
          fi
           
          # PR を作成
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --draft \
            2>&1)
           
          if [ $? -eq 0 ]; then
            # PR number を抽出
            PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+' | head -1)
            if [ -n "$PR_NUMBER" ]; then
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "pull-request-operation=created" >> "$GITHUB_OUTPUT"
              echo "✅ PR created successfully: #$PR_NUMBER ($PR_URL)"
            else
              echo "pull-request-operation=created" >> "$GITHUB_OUTPUT"
              echo "✅ PR created: $PR_URL"
            fi
          else
            echo "❌ PR creation failed: $PR_URL"
            echo "pull-request-operation=none" >> "$GITHUB_OUTPUT"
            exit 1
          fi
 
      - name: Handle syntax check errors
        if: steps.syntax_check.outputs.syntax_check_status == 'failed'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          SYNTAX_ERRORS: ${{ steps.syntax_check.outputs.syntax_errors }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const syntaxErrors = process.env.SYNTAX_ERRORS || '';
             
            const comment = [
              '<!-- weekly-feature-fix-syntax-error -->',
              '## ⚠️ 構文エラーが検出されました',
              '',
              'Copilot が生成したコード内に構文エラーが見つかりました。',
              '',
              '### 🔍 エラーの詳細:',
              '```',
              syntaxErrors.trim(),
              '```',
              '',
              '### 🔧 対応方法:',
              '1. ワークフローのログで詳細なエラーメッセージを確認してください',
              '2. 以下のコマンドで構文を検証できます:',
              '   - YAML: `yamllint .github/workflows/*.yml`',
              '   - JavaScript: `node -c <file.js>`',
              '3. Issue の要件をより詳細に説明して、ワークフローを再実行してください',
              '',
              '### 📝 確認項目:',
              '- [ ] 生成されたコードの構文エラーを手動で修正',
              '- [ ] テストケースが正しいか確認',
              '- [ ] Issue の説明をより具体的な要件で更新',
              '- [ ] ワークフロー実行ログを確認: [GitHub Actions](../../actions/runs/' + process.env.GITHUB_RUN_ID + ')',
            ].join('\n');
             
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
            } catch (error) {
              core.warning(`Failed to create syntax error comment: ${error.message}`);
            }
 
      - name: Handle branch push failure
        if: steps.pr_meta.outputs.has_changes == 'true' && (steps.verify_push.outputs.branch_exists != 'true' || steps.push_branch.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.pr_meta.outputs.branch_name }}
          PUSH_STATUS: ${{ steps.push_branch.outputs.git_push_status }}
          PUSH_ERROR_TYPE: ${{ steps.push_branch.outputs.git_push_error_type }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branchName = process.env.BRANCH_NAME;
            const pushStatus = process.env.PUSH_STATUS || 'unknown';
            const pushErrorType = process.env.PUSH_ERROR_TYPE || 'unknown_error';
              
            // エラータイプに基づいた詳細なコメントを生成
            let errorDetails = '';
            let suggestedAction = '';
             
            switch(pushErrorType) {
              case 'authentication_failed':
                errorDetails = 'GitHub API 認証エラー (401)';
                suggestedAction = '1. `COPILOT_GITHUB_TOKEN` が有効であることを確認してください\n2. トークンの有効期限を確認してください\n3. GitHub UI でトークンのスコープを確認してください';
                break;
              case 'permission_denied':
                errorDetails = 'GitHub API パーミッションエラー (403)';
                suggestedAction = '1. `COPILOT_GITHUB_TOKEN` が `contents: write` スコープを持っていることを確認してください\n2. トークンのリポジトリアクセス設定を確認してください';
                break;
              case 'network_error':
                errorDetails = 'ネットワーク接続エラー (timeout/connection refused)';
                suggestedAction = '1. GitHub のサービスステータスを確認してください\n2. ネットワーク接続を確認してください\n3. ワークフローを再実行してください';
                break;
              case 'local_branch_not_found':
                errorDetails = 'ローカルブランチが見つかりません';
                suggestedAction = '1. Copilot の実行ログを確認してください\n2. git コマンドが実行されたか確認してください\n3. Copilot が正常に実装を完了したか確認してください';
                break;
              default:
                errorDetails = 'Git push エラー（詳細不明）';
                suggestedAction = 'ワークフローのログで詳細を確認してください';
            }
             
            const comment = [
              '<!-- weekly-feature-fix-branch-error -->',
              '## ❌ PR作成失敗: ブランチのプッシュに失敗しました',
              '',
              `**ブランチ:** \`${branchName}\``,
              `**エラータイプ:** ${errorDetails}`,
              '',
              '### 📋 エラーの詳細:',
              `- Push Status: ${pushStatus}`,
              `- Error Classification: ${pushErrorType}`,
              '',
              '### 🔧 考えられる原因と対処方法:',
              suggestedAction,
              '',
              '### 📝 ワークフロー確認手順:',
              '1. [ワークフロー実行ログ](../../actions/runs/' + process.env.GITHUB_RUN_ID + ') で「Check and push feature branch」ステップを確認してください',
              '2. 完全なエラーメッセージを確認してください',
              '3. 必要に応じて手動で修正を行うか、Issue を再度トリガーしてください',
            ].join('\n');
             
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
            } catch (error) {
              core.warning(`Failed to create error comment: ${error.message}`);
            }

      - name: Update issue with PR link
        if: steps.create_pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prUrl = process.env.PR_URL;
            const prNumber = Number(process.env.PR_NUMBER);

            // Get current issue to check labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const currentLabels = (issue.data.labels || []).map(label => label.name);

            // Status ラベルの更新（Progress → Review）
            let newLabels = [...currentLabels];
            let statusMessage = '';

            if (newLabels.includes('Progress')) {
              newLabels = newLabels.filter(label => label !== 'Progress');
              newLabels.push('Review');
              statusMessage = 'Progress → Review に更新';
            } else if (!newLabels.includes('Review')) {
              // Progress ラベルがない場合、Review を追加
              newLabels.push('Review');
              statusMessage = 'Review ラベルを追加';
            } else {
              // Review ラベルが既に存在する場合
              statusMessage = 'Review ラベルは既に存在します';
            }

            // ラベルの重複を削除
            newLabels = [...new Set(newLabels)];

            // Issue のラベルを更新（順序に依存しない比較）
            const currentLabelSet = new Set(currentLabels);
            const newLabelSet = new Set(newLabels);
            const needsUpdate = currentLabelSet.size !== newLabelSet.size ||
              ![...currentLabelSet].every(label => newLabelSet.has(label));

            if (needsUpdate) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: newLabels,
              });
            }

            // PR リンク情報をコメント
            const prComment = [
              '<!-- weekly-feature-fix-pr-created -->',
              '## ✅ PR が作成されました',
              '',
              `この機能に対応するプルリクエストが作成されました。`,
              '',
              `**PR:** [#${prNumber}](${prUrl})`,
              '',
              `**ステータス更新:** ${statusMessage}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: prComment,
            });

      - name: Comment issue - Retry completed
        if: always() && steps.init.outputs.exceeded_max == 'false'
        uses: actions/github-script@v7
        env:
          RETRY_COUNT: ${{ steps.init.outputs.retry_count }}
          COPILOT_OUTCOME: ${{ steps.copilot_exec.outcome }}
          TEST_OUTCOME: ${{ steps.test_exec.outcome }}
          HAS_CHANGES: ${{ steps.pr_meta.outputs.has_changes }}
          PUSH_BRANCH_OUTCOME: ${{ steps.push_branch.outcome }}
          CREATE_PR_OUTCOME: ${{ steps.create_pr.outcome }}
        with:
          script: |
            const marker = '<!-- weekly-feature-fix-retry -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const retryCount = Number(process.env.RETRY_COUNT);
            const copilotOutcome = process.env.COPILOT_OUTCOME || 'unknown';
            const testOutcome = process.env.TEST_OUTCOME || 'unknown';

            const body = [
              marker,
              `### 🔧 Weekly Feature Fix (Attempt ${retryCount + 1}/${process.env.MAX_RETRIES})`,
              '',
              `- retry_count=${retryCount}`,
              `- status=completed`,
              `- copilot_outcome=${copilotOutcome}`,
              `- tests_outcome=${testOutcome}`,
              `- timestamp=${new Date().toISOString()}`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              (comment.body || '').includes(marker) &&
              (comment.body || '').includes(`retry_count=${retryCount}`)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

            // テスト成功時、または最大リトライ到達時の判定
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const MAX_RETRIES = Number(process.env.MAX_RETRIES);
            const pushBranchOutcome = process.env.PUSH_BRANCH_OUTCOME || 'unknown';
            const createPrOutcome = process.env.CREATE_PR_OUTCOME || 'unknown';
            
            if (testOutcome === 'success' && hasChanges && pushBranchOutcome === 'success' && createPrOutcome === 'success') {
              // テスト成功 & 変更あり & push成功 & PR作成成功 → 完了
              core.notice(
                `Issue #${issueNumber} のテストに合格しました。✅ PR が正常に作成されました。`
              );
            } else if (testOutcome === 'success' && hasChanges && pushBranchOutcome === 'failure') {
              // テスト成功 & 変更あり & push失敗 → ブランチプッシュエラー
              core.notice(
                `Issue #${issueNumber}: テストは成功しましたが、git push に失敗しました。❌ Issue のコメントを確認してください。`
              );
            } else if (testOutcome === 'success' && hasChanges && createPrOutcome === 'skipped') {
              // テスト成功 & 変更あり & PR作成スキップ → PR検証エラー
              core.notice(
                `Issue #${issueNumber}: テストは成功しましたが、ブランチの検証に失敗しました。❌ Issue のコメントを確認してください。`
              );
            } else if (!hasChanges) {
              // 変更なし → リトライせず終了（Copilot実装失敗）
              core.notice(
                `Issue #${issueNumber}: 変更が検出されませんでした。実装できませんでした。⚠️ Issue の要件を確認してください。`
              );
            } else if (testOutcome === 'failure' && retryCount < MAX_RETRIES - 1) {
              // テスト失敗 & リトライ回数残ってる → リトライをスケジュール
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'weekly-feature-fix.yml',
                  ref: process.env.GITHUB_REF_NAME || 'main',
                  inputs: {
                    issue_number: String(issueNumber),
                  },
                });
                core.notice(`Issue #${issueNumber} のリトライをスケジュールしました（テスト失敗）。`);
              } catch (error) {
                core.warning(
                  `リトライのスケジュール設定に失敗しました: ${error.message}`
                );
              }
            } else {
              core.notice(
                `Issue #${issueNumber} の処理を終了します。最大リトライ回数 (${MAX_RETRIES}) に達しました。`
              );
            }

  no-issue-found:
    needs: find-feature-issue
    if: needs.find-feature-issue.outputs.found != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log - No feature issue found
        run: |
          echo "FEATURE ラベル付きの実行中の Issue が見つかりません"
          echo "ワークフローは何もアクションを起こさずに完了しました"
