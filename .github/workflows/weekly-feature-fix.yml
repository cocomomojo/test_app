---
name: Weekly Feature Fix with Retry

on:
  schedule:
    # 毎週月曜日 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      issue_number:
        description: >-
          修正対象のIssue番号（指定されない場合は
          最新のFEATUREラベル付きIssueを使用）
        required: false
        type: string

permissions:
  issues: write
  contents: write
  actions: write
  pull-requests: write

jobs:
  find-feature-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.find_issue.outputs.issue_number }}
      issue_title: ${{ steps.find_issue.outputs.issue_title }}
      found: ${{ steps.find_issue.outputs.found }}
    steps:
      - name: Find latest feature issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatchで指定されたissue_numberがあれば使用
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            echo "Using specified issue: $ISSUE_NUMBER"
          else
            # 最新のOpen状態でfeatureラベル付きのIssueを取得
            ISSUE_NUMBER=$(gh issue list \
              --search 'in:title "[FEATURE]" label:feature state:open' \
              --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No feature issue found"
            exit 0
          fi

          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" \
            --json title -q '.title' 2>/dev/null || echo "")

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_title=$ISSUE_TITLE" >> "$GITHUB_OUTPUT"
          echo "Found feature issue: #$ISSUE_NUMBER - $ISSUE_TITLE"

  fix-issue-with-retry:
    needs: find-feature-issue
    if: needs.find-feature-issue.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 1
    env:
      ISSUE_NUMBER: ${{ needs.find-feature-issue.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.find-feature-issue.outputs.issue_title }}
      MAX_RETRIES: 3
      COPILOT_AGENT_RUNNER_TYPE: STANDALONE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize retry counter
        id: init
        run: |
          # コメントから前回の実行回数をチェック
          RETRY_COUNT=0
          COMMENTS=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            -q '.[].body' 2>/dev/null || echo "")

          # 直前のコメントから回数を抽出
          if echo "$COMMENTS" | grep -q "weekly-feature-fix-retry"; then
            LAST_COUNT=$(echo "$COMMENTS" | grep "weekly-feature-fix-retry" | \
              tail -1 | grep -oP 'retry_count=\K[0-9]+' || echo "0")
            RETRY_COUNT=$((LAST_COUNT + 1))
          fi

          echo "retry_count=$RETRY_COUNT" >> "$GITHUB_OUTPUT"
          echo "Retry count: $RETRY_COUNT"

          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "exceeded_max=true" >> "$GITHUB_OUTPUT"
          else
            echo "exceeded_max=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if max retries exceeded
        if: steps.init.outputs.exceeded_max == 'true'
        run: |
          echo "Max retries ($MAX_RETRIES) exceeded. Giving up."

      - name: Comment issue - Retry started
        if: steps.init.outputs.exceeded_max == 'false'
        uses: actions/github-script@v7
        env:
          RETRY_COUNT: ${{ steps.init.outputs.retry_count }}
        with:
          script: |
            const marker = '<!-- weekly-feature-fix-retry -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const retryCount = Number(process.env.RETRY_COUNT);

            const body = [
              marker,
              `### 🔧 Weekly Feature Fix (Attempt ${retryCount + 1}/${process.env.MAX_RETRIES})`,
              '',
              `- retry_count=${retryCount}`,
              `- status=started`,
              `- timestamp=${new Date().toISOString()}`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              (comment.body || '').includes(marker) &&
              (comment.body || '').includes(`retry_count=${retryCount}`)
            );

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Setup Node.js
        if: steps.init.outputs.exceeded_max == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch issue details
        if: steps.init.outputs.exceeded_max == 'false'
        id: issue_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/feature-fix
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels > /tmp/feature-fix/issue.json

          cat /tmp/feature-fix/issue.json

      - name: Generate fix brief
        if: steps.init.outputs.exceeded_max == 'false'
        run: |
          if [ -f scripts/issue-tools.js ]; then
            node scripts/issue-tools.js classify \
              --issue-file /tmp/feature-fix/issue.json \
              --repo "$GITHUB_REPOSITORY" \
              --out /tmp/feature-fix/triage.json || true

            node scripts/issue-tools.js generate-fix-brief \
              --issue-file /tmp/feature-fix/issue.json \
              --triage-file /tmp/feature-fix/triage.json \
              --out-dir /tmp/feature-fix/output || true
          else
            echo "scripts/issue-tools.js not found"
          fi

      - name: Setup GitHub Copilot CLI
        if: steps.init.outputs.exceeded_max == 'false'
        uses: github/gh-aw/actions/setup@466b8ad27fcfaaa861da3f16ba7c01272df25f46
        with:
          destination: /opt/gh-aw/actions

      - name: Install GitHub Copilot CLI
        if: steps.init.outputs.exceeded_max == 'false'
        run: /opt/gh-aw/actions/install_copilot_cli.sh 0.0.421

      - name: Validate COPILOT_GITHUB_TOKEN secret
        if: steps.init.outputs.exceeded_max == 'false'
        run: /opt/gh-aw/actions/validate_multi_secret.sh COPILOT_GITHUB_TOKEN \
          'GitHub Copilot CLI' \
          https://github.github.com/gh-aw/reference/engines/#github-copilot-default
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Generate fix prompt
        if: steps.init.outputs.exceeded_max == 'false'
        id: generate_prompt
        run: |
          mkdir -p /tmp/feature-fix/output

          # Issue情報からプロンプトを生成
          ISSUE_BODY=$(jq -r '.body' /tmp/feature-fix/issue.json)
          ISSUE_TITLE=$(jq -r '.title' /tmp/feature-fix/issue.json)

          cat > /tmp/feature-fix/output/prompt.txt << 'PROMPT_EOF'
          You are a skilled software developer implementing features for a full-stack application.

          PROMPT_EOF

          echo "Issue Title: $ISSUE_TITLE" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "Issue Description:" >> /tmp/feature-fix/output/prompt.txt
          echo "$ISSUE_BODY" >> /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "Tasks:" >> /tmp/feature-fix/output/prompt.txt
          echo "1. Analyze the requirements in the issue" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "2. Implement necessary changes to the codebase" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "3. Create comprehensive test cases" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "4. Ensure all tests pass" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "5. Verify acceptance criteria" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "" >> /tmp/feature-fix/output/prompt.txt
          echo "CRITICAL BRANCHING INSTRUCTIONS:" >> /tmp/feature-fix/output/prompt.txt
          echo "⚠️ DO NOT make changes to the main branch!" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "1. First, create a new feature branch with this exact command:" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "   git checkout -b copilot/issue-${ISSUE_NUMBER}" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "2. Verify you are on the feature branch BEFORE making any changes" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "3. Make all code changes only on this feature branch" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "4. Stage ALL modified files: git add ." >> \
            /tmp/feature-fix/output/prompt.txt
          echo "5. Commit the changes with a descriptive message" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "6. Push ONLY to the feature branch with this exact command:" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "   git push origin copilot/issue-${ISSUE_NUMBER}" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "7. DO NOT push to main branch under any circumstances" >> \
            /tmp/feature-fix/output/prompt.txt
          echo "8. The workflow will automatically create a pull request" >> \
            /tmp/feature-fix/output/prompt.txt

          echo "prompt_generated=true" >> "$GITHUB_OUTPUT"

      - name: Execute GitHub Copilot for implementation
        if: steps.init.outputs.exceeded_max == 'false' &&
            steps.generate_prompt.outputs.prompt_generated == 'true'
        id: copilot_exec
        continue-on-error: true
        run: |
          /usr/local/bin/copilot \
            --add-dir "${GITHUB_WORKSPACE}" \
            --add-dir "/tmp/feature-fix" \
            --disable-builtin-mcps \
            --allow-all-tools \
            --allow-all-paths \
            --prompt "$(cat /tmp/feature-fix/output/prompt.txt)"
        env:
          COPILOT_AGENT_RUNNER_TYPE: ${{ env.COPILOT_AGENT_RUNNER_TYPE }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: /home/runner

      - name: Run tests
        if: steps.init.outputs.exceeded_max == 'false'
        id: test_exec
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"

          # frontend tests
          if [ -d frontend ]; then
            cd frontend
            npm ci 2>/dev/null || true
            npm run build 2>/dev/null || true
            npx vitest run 2>/dev/null || true
            cd "${GITHUB_WORKSPACE}"
          fi

          # backend tests (if applicable)
          if [ -f requirements.txt ]; then
            python -m pytest 2>/dev/null || true
          fi

          echo "Tests completed"

      - name: Collect debug information after Copilot execution
        if: steps.init.outputs.exceeded_max == 'false'
        id: debug_info
        continue-on-error: true
        run: |
          cd "${GITHUB_WORKSPACE}"

          # Copilot execution status
          COPILOT_EXIT_CODE=${{ steps.copilot_exec.outcome }}
          echo "Copilot execution outcome: $COPILOT_EXIT_CODE"

          # Save git status
          echo "=== Collecting Git Status ===" >&2
          GIT_STATUS=$(git status --porcelain)
          GIT_STATUS_SHORT=$(git status --short)
           
          # Save git log
          echo "=== Latest Commits ===" >&2
          GIT_LOG=$(git log --oneline -5)
           
          # Save changed files
          echo "=== Changed Files ===" >&2
          CHANGED_FILES=$(git diff --name-only)
          STAGED_FILES=$(git diff --cached --name-only)
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
           
          # Save diff stats
          echo "=== Diff Statistics ===" >&2
          DIFF_STAT=$(git diff --stat || echo "No diffs")
           
          # Count changes
          MODIFIED_COUNT=$(echo "$GIT_STATUS" | grep "^ M" | wc -l)
          ADDED_COUNT=$(echo "$GIT_STATUS" | grep "^A" | wc -l)
          DELETED_COUNT=$(echo "$GIT_STATUS" | grep "^ D" | wc -l)
          UNTRACKED_COUNT=$(echo "$GIT_STATUS" | grep "^??" | wc -l)
           
          # Store debug information in outputs
          {
            echo "debug_info<<DEBUGEOF"
            echo "## 🔍 Debug Information - Copilot Execution Report"
            echo ""
            echo "### Execution Status"
            echo "- Copilot Exit Code: $COPILOT_EXIT_CODE"
            echo "- Test Outcome: ${{ steps.test_exec.outcome }}"
            echo ""
            echo "### Change Summary"
            echo "- Modified Files: $MODIFIED_COUNT"
            echo "- Added Files: $ADDED_COUNT"
            echo "- Deleted Files: $DELETED_COUNT"
            echo "- Untracked Files: $UNTRACKED_COUNT"
            echo ""
            if [ -n "$CHANGED_FILES" ]; then
              echo "### Modified Files"
              echo "\`\`\`"
              echo "$CHANGED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            if [ -n "$STAGED_FILES" ]; then
              echo "### Staged Files"
              echo "\`\`\`"
              echo "$STAGED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            if [ -n "$UNTRACKED_FILES" ]; then
              echo "### Untracked Files"
              echo "\`\`\`"
              echo "$UNTRACKED_FILES"
              echo "\`\`\`"
              echo ""
            fi
            echo "### Git Status (porcelain)"
            echo "\`\`\`"
            if [ -n "$GIT_STATUS" ]; then
              echo "$GIT_STATUS"
            else
              echo "(no changes)"
            fi
            echo "\`\`\`"
            echo ""
            echo "### Git Log (recent commits)"
            echo "\`\`\`"
            echo "$GIT_LOG"
            echo "\`\`\`"
            echo ""
            echo "### Diff Statistics"
            echo "\`\`\`"
            echo "$DIFF_STAT"
            echo "\`\`\`"
            echo "DEBUGEOF"
          } >> "$GITHUB_OUTPUT"
           
          echo "Debug info collected successfully"

      - name: Detect changes and prepare PR metadata
        if: steps.init.outputs.exceeded_max == 'false' && steps.test_exec.outcome == 'success'
        id: pr_meta
        run: |
          cd "${GITHUB_WORKSPACE}"

          # デバッグログ：ファイルの状態を確認
          echo "=== Git Status ===" >&2
          git status --porcelain
          echo "" >&2
           
          echo "=== Git Diff Summary ===" >&2
          git diff --stat || echo "No changes in git diff"
          echo "" >&2
           
          echo "=== Untracked Files ===" >&2
          git status --short | grep "^??" || echo "No untracked files"
          echo "" >&2

          # チェンジをチェック（未追跡ファイルを含む）
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR メタデータを生成
          BRANCH_NAME="copilot/issue-${ISSUE_NUMBER}"
          PR_TITLE="feat: Implement feature for issue #${ISSUE_NUMBER}"
          PR_COMMIT_MSG="feat: auto-implement issue #${ISSUE_NUMBER}"

          printf 'branch_name=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          printf 'pr_title=%s\n' "$PR_TITLE" >> "$GITHUB_OUTPUT"
          printf 'commit_message=%s\n' "$PR_COMMIT_MSG" >> "$GITHUB_OUTPUT"

          echo "PR metadata prepared: branch=$BRANCH_NAME"

      - name: Generate PR description
        if: steps.pr_meta.outputs.has_changes == 'true'
        id: pr_desc
        run: |
          mkdir -p /tmp/feature-fix/pr

          # Use Python to safely generate PR description with multiline content
          python3 << 'PYTHON_EOF'
          import json
          from datetime import datetime

          with open('/tmp/feature-fix/issue.json') as f:
              issue = json.load(f)

          title = issue.get('title', 'N/A')
          body = issue.get('body', '')
          html_url = issue.get('html_url', 'N/A')
          timestamp = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # Get test result status from environment
          test_outcome = '''${{ steps.test_exec.outcome }}'''
          test_status = '[x] Tests passed' if test_outcome == 'success' else '[✗] Tests failed'
           
          lines = [
              '## 🤖 Auto-generated PR',
              '',
              'This PR was automatically created by GitHub Copilot to address the feature request.',
              '',
              '### Original Issue',
              '',
              f'**Title:** {title}',
              '',
              f'**Issue:** {html_url}',
              '',
              '### Description',
              '',
              body,
              '',
              '### Checklist',
              '',
              '- [x] Implementation completed',
              f'- {test_status}',
              '- [ ] Ready for review',
              '',
              '---',
              '',
              f'Generated by Copilot on {timestamp}'
          ]

          with open('/tmp/feature-fix/pr/description.md', 'w') as f:
              f.write('\n'.join(lines))
          PYTHON_EOF

          echo "pr_body_path=/tmp/feature-fix/pr/description.md" >> "$GITHUB_OUTPUT"

      - name: Report no changes detected
        if: steps.pr_meta.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        env:
          DEBUG_INFO: ${{ steps.debug_info.outputs.debug_info }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const debugInfo = process.env.DEBUG_INFO || '詳細なデバッグ情報は利用できません';

            const comment = [
              '<!-- weekly-feature-fix-no-changes -->',
              '## ⚠️ 変更が検出されません',
              '',
              'Copilot ワークフローは正常に完了し、すべてのテストに合格しましたが、コード変更は検出されませんでした。',
              '',
              debugInfo,
              '',
              '### 次のステップの候補:',
              '- [ ] Issue の要件が明確であることを確認する',
              '- [ ] この機能が既に実装されていないか確認する',
              '- [ ] Copilot 実行ログを確認する（GitHub Actions タブ）',
              '- [ ] 機能を手動で実装する',
              '- [ ] Issue の説明をより具体的な要件で更新する',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
            } catch (error) {
              core.warning(`Failed to create comment: ${error.message}`);
            }

      - name: Create pull request
        id: create_pr
        if: steps.pr_meta.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7.0.1
        with:
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          branch: ${{ steps.pr_meta.outputs.branch_name }}
          base: main
          title: ${{ steps.pr_meta.outputs.pr_title }}
          body-path: ${{ steps.pr_desc.outputs.pr_body_path }}
          commit-message: ${{ steps.pr_meta.outputs.commit_message }}
          draft: true
          delete-branch: false

      - name: Update issue with PR link
        if: steps.create_pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prUrl = process.env.PR_URL;
            const prNumber = Number(process.env.PR_NUMBER);

            // Get current issue to check labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const currentLabels = (issue.data.labels || []).map(label => label.name);

            // Status ラベルの更新（Progress → Review）
            let newLabels = [...currentLabels];
            let statusMessage = '';

            if (newLabels.includes('Progress')) {
              newLabels = newLabels.filter(label => label !== 'Progress');
              newLabels.push('Review');
              statusMessage = 'Progress → Review に更新';
            } else if (!newLabels.includes('Review')) {
              // Progress ラベルがない場合、Review を追加
              newLabels.push('Review');
              statusMessage = 'Review ラベルを追加';
            } else {
              // Review ラベルが既に存在する場合
              statusMessage = 'Review ラベルは既に存在します';
            }

            // ラベルの重複を削除
            newLabels = [...new Set(newLabels)];

            // Issue のラベルを更新（順序に依存しない比較）
            const currentLabelSet = new Set(currentLabels);
            const newLabelSet = new Set(newLabels);
            const needsUpdate = currentLabelSet.size !== newLabelSet.size ||
              ![...currentLabelSet].every(label => newLabelSet.has(label));

            if (needsUpdate) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: newLabels,
              });
            }

            // PR リンク情報をコメント
            const prComment = [
              '<!-- weekly-feature-fix-pr-created -->',
              '## ✅ PR が作成されました',
              '',
              `この機能に対応するプルリクエストが作成されました。`,
              '',
              `**PR:** [#${prNumber}](${prUrl})`,
              '',
              `**ステータス更新:** ${statusMessage}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: prComment,
            });

      - name: Comment issue - Retry completed
        if: always() && steps.init.outputs.exceeded_max == 'false'
        uses: actions/github-script@v7
        env:
          RETRY_COUNT: ${{ steps.init.outputs.retry_count }}
          COPILOT_OUTCOME: ${{ steps.copilot_exec.outcome }}
          TEST_OUTCOME: ${{ steps.test_exec.outcome }}
          HAS_CHANGES: ${{ steps.pr_meta.outputs.has_changes }}
        with:
          script: |
            const marker = '<!-- weekly-feature-fix-retry -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const retryCount = Number(process.env.RETRY_COUNT);
            const copilotOutcome = process.env.COPILOT_OUTCOME || 'unknown';
            const testOutcome = process.env.TEST_OUTCOME || 'unknown';

            const body = [
              marker,
              `### 🔧 Weekly Feature Fix (Attempt ${retryCount + 1}/${process.env.MAX_RETRIES})`,
              '',
              `- retry_count=${retryCount}`,
              `- status=completed`,
              `- copilot_outcome=${copilotOutcome}`,
              `- tests_outcome=${testOutcome}`,
              `- timestamp=${new Date().toISOString()}`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              (comment.body || '').includes(marker) &&
              (comment.body || '').includes(`retry_count=${retryCount}`)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

            // テスト成功時、または最大リトライ到達時の判定
            const hasChanges = process.env.HAS_CHANGES === 'true';
            if (testOutcome === 'success' && hasChanges) {
              core.notice(
                `Issue #${issueNumber} のテストに合格しました。✅ PR が作成されました。`
              );
            } else if (testOutcome === 'success' && !hasChanges) {
              core.notice(
                `Issue #${issueNumber} のテストに合格しましたが、変更が検出されませんでした。⚠️`
              );
            } else if (retryCount < Number(process.env.MAX_RETRIES) - 1) {
              // 次のリトライをスケジュール
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'weekly-feature-fix.yml',
                  ref: process.env.GITHUB_REF_NAME || 'main',
                  inputs: {
                    issue_number: String(issueNumber),
                  },
                });
                core.notice(`Issue #${issueNumber} のリトライをスケジュールしました。`);
              } catch (error) {
                core.warning(
                  `リトライのスケジュール設定に失敗しました: ${error.message}`
                );
              }
            } else {
              core.notice(
                `Issue #${issueNumber} の最大リトライ回数 (${process.env.MAX_RETRIES}) に達しました。中止します。`
              );
            }

  no-issue-found:
    needs: find-feature-issue
    if: needs.find-feature-issue.outputs.found != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log - No feature issue found
        run: |
          echo "FEATURE ラベル付きの実行中の Issue が見つかりません"
          echo "ワークフローは何もアクションを起こさずに完了しました"
