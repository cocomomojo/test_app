name: Feature Issue Auto Implement & PR

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  request-copilot-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Copilot from eligible feature issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labels = (issue.labels || []).map(l => l.name);
            const isFeatureIssue = labels.includes('feature');
            const isAutoGenerated = labels.includes('auto-generated');

            if (!isFeatureIssue || !isAutoGenerated) {
              core.info('Skip: issue is not both feature and auto-generated.');
              return;
            }

            const marker = '<!-- copilot-auto-implement-trigger -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });

            const alreadyTriggered = comments.some(c => (c.body || '').includes(marker));
            if (alreadyTriggered) {
              core.info('Skip: trigger comment already exists.');
              return;
            }

            const commentBody = `${marker}
            @copilot 以下の Issue を実装し、Pull Request を作成してください。

            ## 必須要件
            - Issue #${issue.number} の要件を満たす
            - 変更は最小限で、既存機能を壊さない
            - 関連テストを追加/更新する
            - CI が通る状態にする

            ## PR 要件
            - タイトル先頭に \`feat:\` を付ける
            - 本文に \`Closes #${issue.number}\` を含める
            - 変更点、テスト結果、影響範囲を明記する

            ## 対象
            ${issue.html_url}
            `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: commentBody,
            });

            core.info(`Copilot trigger comment posted for issue #${issue.number}.`);
