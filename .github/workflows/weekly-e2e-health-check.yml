name: Weekly E2E Health Check

on:
  schedule:
    - cron: '0 10 * * 0'  # 毎週日曜日 10:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  e2e-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Analyze E2E test runs from past 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # 過去7日間のE2Eテスト関連ワークフロー実行を取得
          echo "📊 Collecting E2E workflow data from past 7 days..."
          
          # PR Quality Checks内のE2Eテスト失敗を集計
          PR_QUALITY_RUNS=$(gh run list \
            --workflow=pr-quality.yml \
            --created=">=2024-01-01" \
            --status=completed \
            --limit=50 \
            --json=conclusion,createdAt,displayTitle,url \
            -q '.[] | select(.createdAt | fromdateiso8601 > now - 604800)')
          
          # E2E Tests with Coverageワークフロー失敗を集計
          E2E_RUNS=$(gh run list \
            --workflow=e2e.yml \
            --created=">=2024-01-01" \
            --status=completed \
            --limit=50 \
            --json=conclusion,createdAt,displayTitle,url \
            -q '.[] | select(.createdAt | fromdateiso8601 > now - 604800)')
          
          # 失敗数をカウント
          PR_QUALITY_TOTAL=$(echo "$PR_QUALITY_RUNS" | jq 'length' 2>/dev/null || echo 0)
          PR_QUALITY_FAILED=$(echo "$PR_QUALITY_RUNS" | jq '[.[] | select(.conclusion == "failure")] | length' 2>/dev/null || echo 0)
          
          E2E_TOTAL=$(echo "$E2E_RUNS" | jq 'length' 2>/dev/null || echo 0)
          E2E_FAILED=$(echo "$E2E_RUNS" | jq '[.[] | select(.conclusion == "failure")] | length' 2>/dev/null || echo 0)
          
          # 成功率を計算
          if [ "$PR_QUALITY_TOTAL" -gt 0 ]; then
            PR_SUCCESS_RATE=$((100 * (PR_QUALITY_TOTAL - PR_QUALITY_FAILED) / PR_QUALITY_TOTAL))
          else
            PR_SUCCESS_RATE=0
          fi
          
          if [ "$E2E_TOTAL" -gt 0 ]; then
            E2E_SUCCESS_RATE=$((100 * (E2E_TOTAL - E2E_FAILED) / E2E_TOTAL))
          else
            E2E_SUCCESS_RATE=0
          fi
          
          # 結果をファイルに保存
          cat > /tmp/e2e-health.json <<EOF
          {
            "pr_quality_total": $PR_QUALITY_TOTAL,
            "pr_quality_failed": $PR_QUALITY_FAILED,
            "pr_quality_success_rate": $PR_SUCCESS_RATE,
            "e2e_total": $E2E_TOTAL,
            "e2e_failed": $E2E_FAILED,
            "e2e_success_rate": $E2E_SUCCESS_RATE
          }
          EOF
          
          echo "📈 E2E Health Check Results:"
          cat /tmp/e2e-health.json | jq .

      - name: Generate health check report
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path

          # データ読み込み
          with open('/tmp/e2e-health.json', 'r') as f:
            data = json.load(f)

          pr_quality_total = data['pr_quality_total']
          pr_quality_failed = data['pr_quality_failed']
          pr_quality_rate = data['pr_quality_success_rate']
          e2e_total = data['e2e_total']
          e2e_failed = data['e2e_failed']
          e2e_rate = data['e2e_success_rate']

          # 健全性の判定
          def get_health_status(success_rate):
            if success_rate >= 95:
              return "✅ 良好"
            elif success_rate >= 80:
              return "⚠️ 注意"
            else:
              return "🔴 要改善"

          pr_health = get_health_status(pr_quality_rate)
          e2e_health = get_health_status(e2e_rate)

          # レポート本文を作成
          report = f"""## 概要
          
本レポートは、過去7日間の E2E テスト実行状況を分析したものです。

## 📊 テスト実行統計

### PR Quality Checks 内の E2E テスト
- **実行数**: {pr_quality_total} 回
- **失敗数**: {pr_quality_failed} 回
- **成功率**: {pr_quality_rate}%
- **健全性**: {pr_health}

### スタンドアロン E2E テスト
- **実行数**: {e2e_total} 回
- **失敗数**: {e2e_failed} 回
- **成功率**: {e2e_rate}%
- **健全性**: {e2e_health}

## 🔍 分析と改善提案

"""

          if pr_quality_rate < 95 and pr_quality_total > 0:
            report += f"""### PR Quality Checks の E2E テスト失敗の改善
- **課題**: {pr_quality_failed} 回の失敗が検出されています（成功率 {pr_quality_rate}%）
- **原因仮説**:
  - インフラの不安定性（Docker Compose サービスの起動失敗）
  - タイミング依存のテストフレイク
  - 環境変数や設定の不整合
  - ブラウザー/Playwright のバージョン非互換性
- **改善提案**:
  1. 失敗したワークフロー実行を確認し、エラーログを分析してください
  2. 「Finalize E2E test status」ステップの条件ロジックを強化してください
  3. Docker Compose のヘルスチェック タイムアウトを調整してください（現在: 5分）
  4. テストの再試行メカニズムを追加することを検討してください

"""

          if e2e_rate < 95 and e2e_total > 0:
            report += f"""### スタンドアロン E2E テストの失敗の改善
- **課題**: {e2e_failed} 回の失敗が検出されています（成功率 {e2e_rate}%）
- **原因仮説**:
  - ブラウザー互換性の問題
  - カバレッジ収集の失敗
  - バージョン固定やキャッシュの問題
- **改善提案**:
  1. `e2e.yml` の失敗ステップの詳細ログを確認してください
  2. Playwright ブラウザーのインストール時のキャッシュ機構を確認してください
  3. カバレッジ収集ステップの path 設定を改善してください

"""

          if pr_quality_rate >= 95 and e2e_rate >= 95:
            report += f"""### ✅ テスト環境は良好な状態です
- 両方のテストスイートで 95% 以上の成功率を達成しています
- 引き続き現在の設定を維持してください
- 週次分析を継続し、トレンドを監視してください

"""

          report += f"""## 📋 次のアクション

1. **即座に対応** (成功率 < 80%)
   - 失敗ログを詳細確認
   - `e2e-failure-analysis` Issue を確認
   - インフラ/環境の再セットアップ検討

2. **短期対応** (成功率 80-95%)
   - テストフレイク削減対策
   - タイムアウト設定の最適化
   - 再試行ロジックの強化

3. **継続監視**
   - 毎週のこのレポートを確認
   - 長期トレンドを追跡
   - 改善施策の効果を測定

---

**レポート生成日**: {datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')}
"""

          # レポートを保存
          with open('/tmp/e2e-health-report.md', 'w') as f:
            f.write(report)

          print("📄 Health check report generated:")
          print(report)
          PY

      - name: Create or update health check issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/e2e-health-report.md', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            const title = `[E2E HEALTH] ${today} - Weekly E2E Test Stability Report`;
            
            // 過去のレポート Issues を検索
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: ['e2e-health-check'],
              per_page: 10
            });
            
            // 今週のレポートが既に存在するか確認
            const existing = issues.data.find(issue => 
              issue.title.includes('[E2E HEALTH]') &&
              issue.created_at && 
              new Date(issue.created_at).toISOString().split('T')[0] === today
            );
            
            if (existing) {
              core.info(`Updating existing issue #${existing.number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
                state: 'open'
              });
            } else {
              core.info('Creating new health check issue');
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['e2e-health-check']
              });
              core.notice(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
            }
