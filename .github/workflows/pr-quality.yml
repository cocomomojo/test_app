name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # 【E2E分析】PR変更内容がE2Eテストに関連するかを判定
  analyze-e2e-needed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e_needed: ${{ steps.determine_e2e.outputs.e2e_needed }}
      analysis_reason: ${{ steps.determine_e2e.outputs.reason }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        run: |
          # PRのベースブランチからの差分ファイルを取得
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          echo "=== Changed Files ===" >&2
          echo "$FILES" >&2

      - name: Analyze E2E relevance with Copilot
        id: determine_e2e
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}
        run: |
          # ファイル一覧の形式を整える
          FILES_LIST=$(echo "$CHANGED_FILES" | sed 's/^/  - /' | tr '\n' '\n')
          
          cat > /tmp/e2e_analysis.md << 'ANALYSIS_EOF'
          # E2E テスト必要性分析
          
          ## 分析対象
          あなたは、Pull Request の変更内容から E2E（エンドツーエンド）テストの必要性を判定する専門家です。
          
          ## 判定基準
          
          ### ✅ E2E テスト実行が必須（e2e_needed: true）
          以下に該当する場合は、E2E テストが必須です：
          - フロントエンド UI コンポーネント（`frontend/src/components/**/*.vue`）の変更
          - API 仕様・契約の変更（レスポンス形式、エンドポイント追加、エラーハンドリング）
          - 認証・認可機能の変更
          - ルーティング機能の変更（`frontend/src/router/**`）
          - ユーザーインタラクションフロー（フォーム、ナビゲーション）
          - データベーススキーマ変更（マイグレーション）
          - API 層ロジックの変更（新規エンドポイント、既存エンドポイント修正）
          
          ### ❌ E2E テストをスキップ可能（e2e_needed: false）
          以下に該当する場合は、E2E テストをスキップできます：
          - ドキュメント変更（`*.md`、`README`など）
          - CI/CD 設定ファイル（`.github/workflows/**`, `Dockerfile` など）
          - 依存関係更新のみ（`package.json`, `package-lock.json`, `build.gradle`, `gradle.properties` の依存関係）
          - バックエンド内部の実装変更（ユーティリティ、ヘルパー関数など、API 仕様に影響なし）
          - テストコード変更のみ（ユニットテスト、設定ファイル）
          - ログ・デバッグ出力の追加
          - エラーメッセージの改善（API 仕様に影響なし）
          
          ## 変更ファイル一覧
          ANALYSIS_EOF
          
          echo "$FILES_LIST" >> /tmp/e2e_analysis.md
          
          cat >> /tmp/e2e_analysis.md << 'ANALYSIS_EOF'
          
          ## 判定結果の出力形式
          
          JSON 形式で以下のように返してください：
          ```json
          {
            "e2e_needed": true|false,
            "reason": "判定理由（1行。英語または日本語）",
            "analysis": "詳細分析（変更されたファイルの影響度評価）"
          }
          ```
          
          判定をしてください。
          ANALYSIS_EOF
          
          cat /tmp/e2e_analysis.md >&2

      - name: Determine E2E from file patterns (fast path)
        id: fast_check
        run: |
          CHANGED_FILES="${{ steps.changed_files.outputs.changed_files }}"
          
          # 確実にE2Eが必要なパターン
          E2E_MUST_PATTERNS="frontend/src/components|frontend/src/views|frontend/src/router|backend/src/main/java/.*Controller|backend/src/main/java/.*Service"
          
          # 確実にスキップ可能なパターン
          E2E_SKIP_PATTERNS="\.md$|CHANGELOG|\.github/workflows|Dockerfile|package-lock\.json$|build\.gradle\.kts?$|\.gitignore"
          
          E2E_NEEDED="unknown"
          REASON="pattern_analysis_required"
          
          # MUST パターンをチェック
          if echo "$CHANGED_FILES" | grep -E "$E2E_MUST_PATTERNS" > /dev/null; then
            E2E_NEEDED="true"
            REASON="UI/API changes detected"
          fi
          
          # SKIP パターンをチェック（MUSTが確実でない場合）
          if [ "$E2E_NEEDED" = "unknown" ]; then
            SKIP_FILES=$(echo "$CHANGED_FILES" | grep -v -E "$E2E_SKIP_PATTERNS" | wc -l)
            if [ "$SKIP_FILES" -eq 0 ]; then
              # スキップ可能なファイルのみ変更
              E2E_NEEDED="false"
              REASON="only_non_e2e_files_changed"
            fi
          fi
          
          echo "e2e_needed=$E2E_NEEDED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          
          echo "Fast check result: e2e_needed=$E2E_NEEDED, reason=$REASON" >&2

      - name: Final E2E decision
        id: final_decision
        env:
          FAST_RESULT: ${{ steps.fast_check.outputs.e2e_needed }}
          FAST_REASON: ${{ steps.fast_check.outputs.reason }}
        run: |
          # fast_checkの結果が確定している場合はそれを使用
          if [ "$FAST_RESULT" != "unknown" ]; then
            echo "e2e_needed=$FAST_RESULT" >> "$GITHUB_OUTPUT"
            echo "reason=$FAST_REASON" >> "$GITHUB_OUTPUT"
            echo "✓ Fast path: E2E needed = $FAST_RESULT (reason: $FAST_REASON)" >&2
            exit 0
          fi
          
          # unknown の場合は安全側（E2E必須）に
          echo "e2e_needed=true" >> "$GITHUB_OUTPUT"
          echo "reason=unclear_changes_require_e2e" >> "$GITHUB_OUTPUT"
          echo "⚠️ Unclear: defaulting to E2E required for safety" >&2

      - name: Use final decision outputs
        id: determine_e2e
        env:
          E2E_NEEDED: ${{ steps.final_decision.outputs.e2e_needed }}
          REASON: ${{ steps.final_decision.outputs.reason }}
        run: |
          echo "e2e_needed=$E2E_NEEDED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "=== E2E Analysis Complete ===" >&2
          echo "Result: E2E needed = $E2E_NEEDED" >&2
          echo "Reason: $REASON" >&2

  quality-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      frontend_status: ${{ steps.final_status.outputs.frontend_status }}
      backend_status: ${{ steps.final_status.outputs.backend_status }}

    steps:
      - name: Validate PR context
        id: pr_context
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$HEAD_REF" ]; then
            echo "❌ Unexpected: PR context not available (head_ref is empty) despite pull_request event"
            exit 1
          fi
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        id: frontend_unit
        continue-on-error: true
        working-directory: frontend
        run: npm run test:unit

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Run backend unit tests
        id: backend_unit
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-unit-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize quality status
        id: final_status
        run: |
          FRONTEND_STATUS='${{ steps.frontend_unit.outcome }}'
          BACKEND_STATUS='${{ steps.backend_unit.outcome }}'

          echo "frontend_status=${FRONTEND_STATUS}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND_STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$FRONTEND_STATUS" = 'failure' ] || [ "$BACKEND_STATUS" = 'failure' ]; then
            echo 'One or more quality checks failed.' >&2
            exit 1
          fi

  e2e-tests:
    needs: analyze-e2e-needed
    if: github.event_name == 'pull_request' && needs.analyze-e2e-needed.outputs.e2e_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      e2e_status: ${{ steps.e2e_final_status.outputs.e2e_status }}
    env:
      MYSQL_ROOT_PASSWORD: root

    steps:
      - name: Validate PR context
        id: pr_context
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$HEAD_REF" ]; then
            echo "❌ Unexpected: PR context not available (head_ref is empty) despite pull_request event"
            exit 1
          fi
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JaCoCo agent from Gradle
        id: jacoco_extract
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew copyJacocoAgent
          mkdir -p ../infra/jacoco ../infra/jacoco-output
          cp build/jacoco/jacocoagent.jar ../infra/jacoco/jacocoagent.jar

      - name: Start Docker Compose services
        id: docker_start
        continue-on-error: true
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        id: health_check
        continue-on-error: true
        working-directory: infra
        timeout-minutes: 5
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null && break
            [ "$i" -eq 30 ] && { echo "MySQL failed"; exit 1; }
            sleep 3
          done

          echo "Waiting for Spring Boot..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "Spring Boot ready"; break; }
            [ "$i" -eq 60 ] && { docker compose -f docker-compose.ci.yml logs springboot; exit 1; }
            sleep 3
          done

          echo "Waiting for Frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 > /dev/null && { echo "Frontend ready"; break; }
            [ "$i" -eq 30 ] && { docker compose -f docker-compose.ci.yml logs frontend; exit 1; }
            sleep 2
          done

      - name: Setup Node.js
        if: steps.health_check.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        if: steps.health_check.outcome == 'success'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.health_check.outcome == 'success'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (with JS coverage)
        id: e2e_run
        if: steps.health_check.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: npm run test:e2e

      - name: Generate frontend coverage report
        if: always()
        working-directory: frontend
        run: |
          if [ -d "coverage/e2e-raw" ] && [ "$(ls -A coverage/e2e-raw)" ]; then
            echo "✓ Found coverage files, generating report..."
            sed -i "s|\"/app/|\"$(pwd)/|g" coverage/e2e-raw/*.json 2>/dev/null || true
            npm run coverage:report
          else
            echo "✗ No frontend coverage data found"
            mkdir -p coverage/e2e-report
            echo "<h1>No frontend coverage data available</h1>" > coverage/e2e-report/index.html
          fi

      - name: Upload frontend E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: frontend/coverage/e2e-report
          if-no-files-found: warn
          retention-days: 7

      - name: Generate backend E2E coverage report
        if: always()
        working-directory: backend
        run: |
          if [ -f "../infra/jacoco-output/jacoco.exec" ]; then
            ./gradlew jacocoE2EReport
          else
            echo "No jacoco.exec found, skipping E2E coverage report"
          fi

      - name: Upload backend E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-e2e-coverage
          path: backend/build/reports/jacoco/jacocoE2EReport/html
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize E2E test status
        id: e2e_final_status
        env:
          DOCKER_STATUS: ${{ steps.docker_start.outcome }}
          HEALTH_STATUS: ${{ steps.health_check.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_run.outcome }}
        run: |
          # If docker or health check failed, report failure
          if [ "$DOCKER_STATUS" = "failure" ] || [ "$HEALTH_STATUS" = "failure" ]; then
            echo "e2e_status=failure" >> "$GITHUB_OUTPUT"
          else
            # Otherwise, use E2E test outcome (or skipped if empty)
            E2E_STATUS="${E2E_OUTCOME}"
            [ -z "$E2E_STATUS" ] && E2E_STATUS="skipped"
            echo "e2e_status=${E2E_STATUS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop Docker Compose services
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml down -v

      - name: Trigger E2E analysis if failed
        if: steps.e2e_run.outcome == 'failure' || steps.docker_start.outcome == 'failure' || steps.health_check.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            // E2E失敗時に自動分析をdispatch
            core.info('E2E tests failed. Triggering e2e-failure-analysis...');
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e-failure-analysis.yml',
                ref: context.ref,
                inputs: {
                  run_id: context.runId.toString()
                }
              });
              core.notice('✅ E2E failure analysis workflow dispatched');
            } catch (error) {
              core.warning(`Failed to dispatch e2e-failure-analysis: ${error.message}`);
            }

  report-to-pr:
    needs: [quality-checks, analyze-e2e-needed]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Validate PR context
        id: pr_context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "⚠️ PR context not available (pull_request.number is empty)"
            echo "Skipping PR comment and label update."
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Add bug-analysis-needed label if E2E failed
        if: failure() && steps.pr_context.outputs.pr_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['bug-analysis-needed']
              });
              core.info('✅ Added bug-analysis-needed label');
            } catch (error) {
              core.warning(`Failed to add label: ${error.message}`);
            }

      - name: Comment PR with quality results
        if: steps.pr_context.outputs.pr_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          FRONTEND_STATUS: ${{ needs.quality-checks.outputs.frontend_status }}
          BACKEND_STATUS: ${{ needs.quality-checks.outputs.backend_status }}
          E2E_NEEDED: ${{ needs.analyze-e2e-needed.outputs.e2e_needed }}
          E2E_REASON: ${{ needs.analyze-e2e-needed.outputs.analysis_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- pr-quality-checks -->';
            const prNumber = context.payload.pull_request.number;

            const icon = (status) => {
              switch (status) {
                case 'success': return '✅ success';
                case 'failure': return '❌ failure';
                case 'skipped': return '⏭️ skipped';
                default: return `ℹ️ ${status || 'unknown'}`;
              }
            };

            const e2eNeeded = process.env.E2E_NEEDED;
            const e2eReason = process.env.E2E_REASON;
            
            let e2eSection = '';
            if (e2eNeeded === 'true') {
              e2eSection = `- E2E Tests with Coverage: ⏱️ running (変更がE2E関連：${e2eReason})`;
            } else if (e2eNeeded === 'false') {
              e2eSection = `- E2E Tests with Coverage: ⏭️ skipped\n  💡 E2E テストはスキップされました (理由: ${e2eReason})\n  📊 [詳細: ${process.env.RUN_URL}](${process.env.RUN_URL})`;
            } else {
              e2eSection = `- E2E Tests with Coverage: ℹ️ status unknown`;
            }

            const body = [
              marker,
              '### 🔎 PR Quality Checks',
              '',
              `- Frontend Unit Tests: ${icon(process.env.FRONTEND_STATUS)}`,
              `- Backend Unit Tests: ${icon(process.env.BACKEND_STATUS)}`,
              e2eSection,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
