name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      frontend_status: ${{ steps.final_status.outputs.frontend_status }}
      backend_status: ${{ steps.final_status.outputs.backend_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        id: frontend_unit
        continue-on-error: true
        working-directory: frontend
        run: npm run test:unit

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Run backend unit tests
        id: backend_unit
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-unit-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize quality status
        id: final_status
        run: |
          FRONTEND_STATUS='${{ steps.frontend_unit.outcome }}'
          BACKEND_STATUS='${{ steps.backend_unit.outcome }}'

          echo "frontend_status=${FRONTEND_STATUS}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND_STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$FRONTEND_STATUS" = 'failure' ] || [ "$BACKEND_STATUS" = 'failure' ]; then
            echo 'One or more quality checks failed.' >&2
            exit 1
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      e2e_status: ${{ steps.e2e_final_status.outputs.e2e_status }}
    env:
      MYSQL_ROOT_PASSWORD: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JaCoCo agent from Gradle
        id: jacoco_extract
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew copyJacocoAgent
          mkdir -p ../infra/jacoco ../infra/jacoco-output
          cp build/jacoco/jacocoagent.jar ../infra/jacoco/jacocoagent.jar

      - name: Start Docker Compose services
        id: docker_start
        continue-on-error: true
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        id: health_check
        continue-on-error: true
        working-directory: infra
        timeout-minutes: 5
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null && break
            [ "$i" -eq 30 ] && { echo "MySQL failed"; exit 1; }
            sleep 3
          done

          echo "Waiting for Spring Boot..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "Spring Boot ready"; break; }
            [ "$i" -eq 60 ] && { docker compose -f docker-compose.ci.yml logs springboot; exit 1; }
            sleep 3
          done

          echo "Waiting for Frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 > /dev/null && { echo "Frontend ready"; break; }
            [ "$i" -eq 30 ] && { docker compose -f docker-compose.ci.yml logs frontend; exit 1; }
            sleep 2
          done

      - name: Setup Node.js
        if: steps.health_check.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        if: steps.health_check.outcome == 'success'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.health_check.outcome == 'success'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (with JS coverage)
        id: e2e_run
        if: steps.health_check.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: npm run test:e2e

      - name: Generate frontend coverage report
        if: always()
        working-directory: frontend
        run: |
          if [ -d "coverage/e2e-raw" ] && [ "$(ls -A coverage/e2e-raw)" ]; then
            echo "✓ Found coverage files, generating report..."
            sed -i "s|\"/app/|\"$(pwd)/|g" coverage/e2e-raw/*.json 2>/dev/null || true
            npm run coverage:report
          else
            echo "✗ No frontend coverage data found"
            mkdir -p coverage/e2e-report
            echo "<h1>No frontend coverage data available</h1>" > coverage/e2e-report/index.html
          fi

      - name: Upload frontend E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: frontend/coverage/e2e-report
          if-no-files-found: warn
          retention-days: 7

      - name: Generate backend E2E coverage report
        if: always()
        working-directory: backend
        run: |
          if [ -f "../infra/jacoco-output/jacoco.exec" ]; then
            ./gradlew jacocoE2EReport
          else
            echo "No jacoco.exec found, skipping E2E coverage report"
          fi

      - name: Upload backend E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-e2e-coverage
          path: backend/build/reports/jacoco/jacocoE2EReport/html
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize E2E test status
        id: e2e_final_status
        env:
          DOCKER_STATUS: ${{ steps.docker_start.outcome }}
          HEALTH_STATUS: ${{ steps.health_check.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_run.outcome }}
        run: |
          # If docker or health check failed, report failure
          if [ "$DOCKER_STATUS" = "failure" ] || [ "$HEALTH_STATUS" = "failure" ]; then
            echo "e2e_status=failure" >> "$GITHUB_OUTPUT"
          else
            # Otherwise, use E2E test outcome (or skipped if empty)
            E2E_STATUS="${E2E_OUTCOME}"
            [ -z "$E2E_STATUS" ] && E2E_STATUS="skipped"
            echo "e2e_status=${E2E_STATUS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop Docker Compose services
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.ci.yml down -v

  report-to-pr:
    needs: [quality-checks, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with quality results
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          FRONTEND_STATUS: ${{ needs.quality-checks.outputs.frontend_status }}
          BACKEND_STATUS: ${{ needs.quality-checks.outputs.backend_status }}
          E2E_STATUS: ${{ needs.e2e-tests.outputs.e2e_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- pr-quality-checks -->';
            const prNumber = context.payload.pull_request.number;

            const icon = (status) => {
              switch (status) {
                case 'success': return '✅ success';
                case 'failure': return '❌ failure';
                case 'skipped': return '⏭️ skipped';
                default: return `ℹ️ ${status || 'unknown'}`;
              }
            };

            const body = [
              marker,
              '### 🔎 PR Quality Checks',
              '',
              `- Frontend Unit Tests: ${icon(process.env.FRONTEND_STATUS)}`,
              `- Backend Unit Tests: ${icon(process.env.BACKEND_STATUS)}`,
              `- E2E Tests with Coverage: ${icon(process.env.E2E_STATUS)}`,
              `- Workflow Run: ${process.env.RUN_URL}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }