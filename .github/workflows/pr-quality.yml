name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      frontend_status: ${{ steps.final_status.outputs.frontend_status }}
      backend_status: ${{ steps.final_status.outputs.backend_status }}
      sonar_status: ${{ steps.final_status.outputs.sonar_status }}
      sonar_reason: ${{ steps.final_status.outputs.sonar_reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        id: frontend_unit
        continue-on-error: true
        working-directory: frontend
        run: npm run test:unit

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Run backend unit tests
        id: backend_unit
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Determine SonarQube availability
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork PR では secret を利用できないため SonarQube をスキップ" >> "$GITHUB_OUTPUT"
          elif [ -z "$SONAR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=SONAR_TOKEN が未設定のため SonarQube をスキップ" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SonarQube packages
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube analysis
        id: sonar_scan
        if: steps.sonar_config.outputs.enabled == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Finalize quality status
        id: final_status
        run: |
          FRONTEND_STATUS='${{ steps.frontend_unit.outcome }}'
          BACKEND_STATUS='${{ steps.backend_unit.outcome }}'
          SONAR_REASON='${{ steps.sonar_config.outputs.reason }}'

          if [ '${{ steps.sonar_config.outputs.enabled }}' = 'true' ]; then
            SONAR_STATUS='${{ steps.sonar_scan.outcome }}'
          else
            SONAR_STATUS='skipped'
          fi

          echo "frontend_status=${FRONTEND_STATUS}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND_STATUS}" >> "$GITHUB_OUTPUT"
          echo "sonar_status=${SONAR_STATUS}" >> "$GITHUB_OUTPUT"
          echo "sonar_reason=${SONAR_REASON}" >> "$GITHUB_OUTPUT"

          if [ "$FRONTEND_STATUS" = 'failure' ] || [ "$BACKEND_STATUS" = 'failure' ] || [ "$SONAR_STATUS" = 'failure' ]; then
            echo 'One or more quality checks failed.' >&2
            exit 1
          fi

  report-to-pr:
    needs: quality-checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with quality results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FRONTEND_STATUS: ${{ needs.quality-checks.outputs.frontend_status }}
          BACKEND_STATUS: ${{ needs.quality-checks.outputs.backend_status }}
          SONAR_STATUS: ${{ needs.quality-checks.outputs.sonar_status }}
          SONAR_REASON: ${{ needs.quality-checks.outputs.sonar_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- pr-quality-checks -->';
            const prNumber = context.payload.pull_request.number;

            const icon = (status) => {
              switch (status) {
                case 'success': return '✅ success';
                case 'failure': return '❌ failure';
                case 'skipped': return '⏭️ skipped';
                default: return `ℹ️ ${status || 'unknown'}`;
              }
            };

            const body = [
              marker,
              '### 🔎 PR Quality Checks',
              '',
              `- Frontend Unit Tests: ${icon(process.env.FRONTEND_STATUS)}`,
              `- Backend Unit Tests: ${icon(process.env.BACKEND_STATUS)}`,
              `- SonarQube Static Analysis: ${icon(process.env.SONAR_STATUS)}`,
              '',
              process.env.SONAR_STATUS === 'skipped'
                ? `- SonarQube 補足: ${process.env.SONAR_REASON}`
                : '- SonarQube は unit test 実行後の coverage を用いて解析しました。',
              `- Workflow Run: ${process.env.RUN_URL}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }