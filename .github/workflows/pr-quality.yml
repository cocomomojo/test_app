name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      frontend_status: ${{ steps.final_status.outputs.frontend_status }}
      backend_status: ${{ steps.final_status.outputs.backend_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        id: frontend_unit
        continue-on-error: true
        working-directory: frontend
        run: npm run test:unit

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Run backend unit tests
        id: backend_unit
        continue-on-error: true
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize quality status
        id: final_status
        run: |
          FRONTEND_STATUS='${{ steps.frontend_unit.outcome }}'
          BACKEND_STATUS='${{ steps.backend_unit.outcome }}'

          echo "frontend_status=${FRONTEND_STATUS}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND_STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$FRONTEND_STATUS" = 'failure' ] || [ "$BACKEND_STATUS" = 'failure' ]; then
            echo 'One or more quality checks failed.' >&2
            exit 1
          fi

  report-to-pr:
    needs: quality-checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with quality results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FRONTEND_STATUS: ${{ needs.quality-checks.outputs.frontend_status }}
          BACKEND_STATUS: ${{ needs.quality-checks.outputs.backend_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- pr-quality-checks -->';
            const prNumber = context.payload.pull_request.number;

            const icon = (status) => {
              switch (status) {
                case 'success': return '✅ success';
                case 'failure': return '❌ failure';
                case 'skipped': return '⏭️ skipped';
                default: return `ℹ️ ${status || 'unknown'}`;
              }
            };

            const body = [
              marker,
              '### 🔎 PR Quality Checks',
              '',
              `- Frontend Unit Tests: ${icon(process.env.FRONTEND_STATUS)}`,
              `- Backend Unit Tests: ${icon(process.env.BACKEND_STATUS)}`,
              `- Workflow Run: ${process.env.RUN_URL}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }