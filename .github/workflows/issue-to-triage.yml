name: Issue Triage for AI Fix Flow

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '分類対象の issue 番号'
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue &&
        github.event.issue.state == 'open' &&
        (
          github.event.action != 'labeled' ||
          !github.event.label ||
          (
            !startsWith(github.event.label.name, 'bug-pattern:') &&
            !startsWith(github.event.label.name, 'severity:') &&
            github.event.label.name != 'ai-fixable' &&
            github.event.label.name != 'needs-human-triage'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Fetch issue payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/issue-triage
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels > /tmp/issue-triage/issue.json

      - name: Classify issue
        run: |
          node scripts/issue-tools.js classify \
            --issue-file /tmp/issue-triage/issue.json \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/issue-triage/result.json
          cat /tmp/issue-triage/result.json

      - name: Apply triage labels and summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_PATH: /tmp/issue-triage/result.json
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- issue-to-triage -->';
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labelCatalog = {
              'ai-fixable': { color: '0e8a16', description: 'AI 修正提案フローの対象 Issue' },
              'needs-human-triage': { color: 'd876e3', description: '自動分類できず人手の triage が必要' },
              'severity:low': { color: 'c2e0c6', description: '影響度 low' },
              'severity:medium': { color: 'fbca04', description: '影響度 medium' },
              'severity:high': { color: 'd93f0b', description: '影響度 high' },
              'severity:critical': { color: 'b60205', description: '影響度 critical' },
              'bug-pattern:frontend-ui-text': { color: '1d76db', description: 'Frontend UI text mismatch' },
              'bug-pattern:frontend-unit-test': { color: '1d76db', description: 'Frontend unit test issue' },
              'bug-pattern:backend': { color: '5319e7', description: 'Backend issue' },
              'bug-pattern:ci-config': { color: '0052cc', description: 'CI / workflow config issue' },
              'bug-pattern:e2e-environment': { color: '0e8a16', description: 'E2E environment / readiness issue' },
              'bug-pattern:docs-manual': { color: '0075ca', description: 'Documentation or manual issue' },
            };

            async function ensureLabel(name) {
              const meta = labelCatalog[name];
              if (!meta) return;

              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color: meta.color, description: meta.description });
              }
            }

            for (const label of result.labelsToAdd || []) {
              await ensureLabel(label);
            }

            for (const label of result.labelsToRemove || []) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if ((result.labelsToAdd || []).length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: result.labelsToAdd,
              });
            }

            const body = [
              marker,
              '### 🧭 Issue Triage Result',
              '',
              `- bug_pattern: ${result.bugPattern || 'unresolved'}`,
              `- severity: ${result.severity || 'unknown'}`,
              `- ai_fixable: ${result.aiFixable ? 'true' : 'false'}`,
              `- reason: ${result.reason}`,
              '',
              result.aiFixable
                ? '- 次の候補: `issue-to-fix-brief.yml` を自動 dispatch（既存 fix brief がない場合）'
                : '- 次の候補: 人手で分類を補完してから fix brief を生成',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Dispatch fix brief workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_PATH: /tmp/issue-triage/result.json
        with:
          script: |
            const fs = require('fs');

            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fixBriefMarker = '<!-- issue-to-fix-brief -->';
            const ref = process.env.GITHUB_REF_NAME || context.ref.replace('refs/heads/', '');

            if (!result.aiFixable) {
              core.notice(`Skip fix brief dispatch because issue #${issueNumber} is not ai-fixable.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existingFixBrief = comments.find((comment) => (comment.body || '').includes(fixBriefMarker));

            if (existingFixBrief) {
              core.notice(`Skip fix brief dispatch because issue #${issueNumber} already has a generated fix brief comment.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'issue-to-fix-brief.yml',
              ref,
              inputs: {
                issue_number: String(issueNumber),
              },
            });

            core.notice(`Dispatched issue-to-fix-brief.yml for issue #${issueNumber} on ref ${ref}.`);
