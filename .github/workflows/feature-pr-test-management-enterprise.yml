name: Feature PR Test Management (Enterprise)

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-test-assets:
    if: >-
      vars.COPILOT_ENTERPRISE_AUTOMATION == 'true' &&
      (
        contains(join(github.event.pull_request.labels.*.name, ','), 'feature') ||
        startsWith(github.event.pull_request.title, 'feat:') ||
        startsWith(github.event.pull_request.title, '[FEATURE]')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate linked Issue and planner output (required)
        id: agent_guard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const body = context.payload.pull_request?.body || '';
            const m = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/i);
            if (!m) {
              core.setFailed('PR本文に `Closes #<Issue番号>` がありません。Playwright Test Agents の planner 成果物との紐付けのため必須です。');
              return;
            }

            const issueNumber = Number(m[1]);
            const specsDir = path.join(process.cwd(), 'qa', 'test-management', 'specs');
            const expectedPrefix = `issue-${issueNumber}-`;

            if (!fs.existsSync(specsDir)) {
              core.setFailed(`必須ディレクトリが見つかりません: ${specsDir}`);
              return;
            }

            const matches = fs.readdirSync(specsDir)
              .filter((name) => name.startsWith(expectedPrefix) && name.endsWith('.md'))
              .sort();

            if (!matches.length) {
              core.setFailed(`Playwright planner 成果物が見つかりません。期待: qa/test-management/specs/${expectedPrefix}*.md`);
              return;
            }

            const plannerSpec = `qa/test-management/specs/${matches[0]}`;
            core.info(`Found planner spec: ${plannerSpec}`);
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('planner_spec', plannerSpec);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect and validate agent-provided test assets
        run: node scripts/collect-pr-test-assets-meta.js

      - name: Update test dashboard
        run: node scripts/update-test-dashboard.js

      - name: Commit and push generated assets
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/test-management
          git commit -m "test: collect agent-provided test assets (#${{ github.event.pull_request.number }})"
          git push

      - name: Comment PR with test artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.ref;

            const metaPath = `qa/test-management/.meta/pr-${prNumber}.json`;
            if (!fs.existsSync(metaPath)) {
              core.setFailed(`metaファイルが見つかりません: ${metaPath}`);
              return;
            }

            const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
            const plannerSpec = JSON.parse('${{ toJson(steps.agent_guard.outputs.planner_spec) }}');

            const toUrl = (p) => `https://github.com/${owner}/${repo}/blob/${headRef}/${p}`;
            const marker = '<!-- test-management-links -->';
            const body = [
              marker,
              '### 🤖 テスト設計/テスト項目を更新しました',
              `- テスト設計 + テスト項目: [${meta.generatedPlan}](${toUrl(meta.generatedPlan)})`,
              `- E2E雛形（generator相当）: [${meta.generatedSpec}](${toUrl(meta.generatedSpec)})`,
              `- Planner成果物（必須）: [${plannerSpec}](${toUrl(plannerSpec)})`,
              '',
              '> この運用では、Playwright Test Agents（planner）成果物の存在を必須チェックしています。'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
