name: Weekly Feature Improvement Issue

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      category:
        description: 'Feature Category (Frontend/Backend/Both)'
        required: false
        type: choice
        default: 'Both'
        options:
          - Frontend
          - Backend
          - Both
      difficulty:
        description: 'Implementation Difficulty (Low/Medium/High)'
        required: false
        type: choice
        default: 'Medium'
        options:
          - Low
          - Medium
          - High

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Scripts
        uses: github/gh-aw/actions/setup@466b8ad27fcfaaa861da3f16ba7c01272df25f46
        with:
          destination: /opt/gh-aw/actions

      - name: Validate COPILOT_GITHUB_TOKEN secret
        run: /opt/gh-aw/actions/validate_multi_secret.sh COPILOT_GITHUB_TOKEN 'GitHub Copilot CLI' https://github.github.com/gh-aw/reference/engines/#github-copilot-default
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Install GitHub Copilot CLI
        run: /opt/gh-aw/actions/install_copilot_cli.sh 0.0.421

      - name: Analyze existing implementations
        id: analyze_impl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import subprocess
          import json
          from datetime import datetime, timedelta
          from pathlib import Path

          # Get recent commits (past 30 days) with messages
          result = subprocess.run(
            ['git', 'log', '--oneline', '--since=30 days ago'],
            capture_output=True,
            text=True,
            cwd='.'
          )
           
          commits = result.stdout.strip().split('\n') if result.stdout.strip() else []
           
          # Extract commit messages
          commit_keywords = []
          for commit in commits:
            if commit:
              # Get full commit message
              msg_result = subprocess.run(
                ['git', 'log', '--format=%B', '-n', '1', commit.split()[0]],
                capture_output=True,
                text=True,
                cwd='.'
              )
              msg = msg_result.stdout.lower()
              commit_keywords.extend(msg.split())
           
          # Get list of open feature issues
          open_issues_result = subprocess.run(
            ['gh', 'issue', 'list', '--search', 'label:feature state:open', '--json', 'body,title'],
            capture_output=True,
            text=True
          )
           
          open_issues_text = ''
          try:
            if open_issues_result.stdout:
              open_issues = json.loads(open_issues_result.stdout)
              open_issues_text = '\n'.join([
                f"{issue['title']}: {issue['body'][:200]}"
                for issue in open_issues
              ])
          except:
            pass
           
          # Save analysis results
          with open('./existing_implementations.txt', 'w') as f:
            f.write('### Recent Commits (past 30 days)\n')
            for commit in commits[:20]:  # Last 20 commits
              f.write(f'{commit}\n')
            f.write('\n### Open Feature Issues\n')
            f.write(open_issues_text if open_issues_text else '(No open feature issues)')
           
          print('✓ Existing implementations analyzed')
          PY

      - name: Create Copilot prompt
        env:
          FEATURE_CATEGORY: ${{ github.event.inputs.category || 'Both' }}
          DIFFICULTY_LEVEL: ${{ github.event.inputs.difficulty || 'Medium' }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          category = os.environ.get('FEATURE_CATEGORY', 'Both')
          difficulty = os.environ.get('DIFFICULTY_LEVEL', 'Medium')
           
          # Read existing implementations
          existing_impl = Path('./existing_implementations.txt').read_text(encoding='utf-8')

          prompt = f"""Analyze this Vue 3 + Spring Boot project and propose ONE UNIQUE useful feature improvement.

          ## Context
          - Feature Category: {category}
          - Difficulty Level: {difficulty}
          - Project Structure: Frontend (Vue 3 + Vuetify), Backend (Spring Boot 3)

          ## IMPORTANT: Avoid Duplicates
          Review the following existing implementations and open issues.
          **DO NOT propose features that are already implemented or already have open issues.**
          Propose a NEW, UNIQUE feature that is NOT listed below:

          {existing_impl}

          ## Requirements
          Output ONLY valid JSON in this exact format (no other text, no markdown):
          {{
            "title": "[FEATURE] Feature Name",
            "background": "Why this feature is needed, considering current system state",
            "feature_description": "Detailed description of what should be implemented",
            "acceptance_criteria": ["Criterion 1", "Criterion 2", "Criterion 3"],
            "estimated_effort": "XS/S/M/L/XL"
          }}"""

          with open('./copilot-prompt.txt', 'w') as f:
            f.write(prompt)
          print("✓ Prompt created with existing implementation context")
          PY

      - name: Execute Copilot for feature proposal
        env:
          COPILOT_AGENT_RUNNER_TYPE: STANDALONE
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: /home/runner
        run: |
          /usr/local/bin/copilot \
            --add-dir "${GITHUB_WORKSPACE}" \
            --model claude-haiku-4.5 \
            --disable-builtin-mcps \
            --allow-all-tools \
            --allow-all-paths \
            --prompt "$(cat ./copilot-prompt.txt)" \
            > ./copilot-response.txt 2>&1

      - name: Extract and validate proposal JSON
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          response_file = Path('./copilot-response.txt')
          response_text = response_file.read_text(encoding='utf-8', errors='replace')

          # Extract JSON from response (try code block first, then direct match)
          json_text = None

          # Try to extract JSON from code block
          match = re.search(r'```(?:json)?\s*\n(.*?)\n```', response_text, re.DOTALL)
          if match:
            json_text = match.group(1).strip()
          else:
            # Try to find JSON object directly
            match = re.search(r'\{(?:[^{}]|(?:\{[^{}]*\}))*\}', response_text, re.DOTALL)
            if match:
              json_text = match.group(0).strip()

          if not json_text:
            print('ERROR: JSON not found in response')
            print('Response:', response_text[:500])
            exit(1)

          try:
            proposal = json.loads(json_text)

            # Validate required fields
            required_fields = ['title', 'background', 'feature_description', 'acceptance_criteria']
            for field in required_fields:
              if field not in proposal:
                print(f'ERROR: Missing required field: {field}')
                exit(1)

            # Validate acceptance_criteria is a list
            if not isinstance(proposal.get('acceptance_criteria'), list):
              print('ERROR: acceptance_criteria must be a list')
              exit(1)

            if not proposal.get('acceptance_criteria'):
              print('ERROR: acceptance_criteria must not be empty')
              exit(1)

            # Ensure title starts with [FEATURE]
            if not proposal['title'].startswith('[FEATURE]'):
              proposal['title'] = f"[FEATURE] {proposal['title']}"

            # Write validated proposal
            Path('./proposal.json').write_text(
              json.dumps(proposal, ensure_ascii=False, indent=2),
              encoding='utf-8'
            )
            print('✓ Proposal validated and saved')

          except json.JSONDecodeError as e:
            print(f'ERROR: Invalid JSON: {e}')
            print('JSON text:', json_text[:200])
            exit(1)
          except Exception as e:
            print(f'ERROR: {e}')
            exit(1)
          PY

      - name: Build Issue content from proposal
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          proposal = json.loads(Path('./proposal.json').read_text(encoding='utf-8'))

          # Build issue title and body
          title = proposal['title']

          body_parts = [
            '## Background',
            proposal['background'],
            '',
            '## Feature Description',
            proposal['feature_description'],
            '',
            '## Acceptance Criteria'
          ]

          for criterion in proposal.get('acceptance_criteria', []):
            body_parts.append(f'- [ ] {criterion}')

          body_parts.extend([
            '',
            '## Estimated Effort',
            proposal.get('estimated_effort', 'N/A'),
            '',
            '## Implementation Workflow',
            'This issue will be implemented following this workflow:',
            '1. Review the issue requirements and scope',
            '2. Request Copilot to implement the feature',
            '3. Copilot will:',
            '   - Design test cases and create tests',
            '   - Implement the feature according to specs',
            '   - Run unit and E2E tests',
            '   - Create a PR when all tests pass',
            '4. Review, approve, and merge the PR'
          ])

          # Save title and body
          Path('./issue-title.txt').write_text(title, encoding='utf-8')
          Path('./issue-body.md').write_text('\n'.join(body_parts), encoding='utf-8')

          print(f'✓ Issue content prepared')
          print(f'  Title: {title}')
          PY

      - name: Check for existing issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import re
          from pathlib import Path

          title = Path('./issue-title.txt').read_text(encoding='utf-8').strip()
          body = Path('./issue-body.md').read_text(encoding='utf-8').strip()
           
          # Check by exact title match first (fastest)
          result = subprocess.run(
            ['gh', 'issue', 'list', '--search', f'in:title "{title}"', '--state', 'open', '--json', 'number,title,body'],
            capture_output=True,
            text=True
          )
           
          if result.returncode == 0 and result.stdout:
            try:
              issues = json.loads(result.stdout)
              if issues:
                issue_num = issues[0]['number']
                with open('check_result.txt', 'w') as f:
                  f.write(f"exists=true\n")
                  f.write(f"number={issue_num}\n")
                print(f"ℹ️ Issue #{issue_num} already exists with this title")
                exit(0)
            except:
              pass
           
          # Check for similar issues by keyword match
          result = subprocess.run(
            ['gh', 'issue', 'list', '--label', 'feature', '--state', 'open', '--json', 'number,title,body'],
            capture_output=True,
            text=True
          )
           
          if result.returncode == 0 and result.stdout:
            try:
              open_issues = json.loads(result.stdout)
               
              # Extract key terms from the new proposal
              new_keywords = set(re.findall(r'\w{3,}', title.lower()))
              new_keywords |= set(re.findall(r'\w{5,}', body.lower()))  # Words 5+ chars
               
              # Compare with existing issues
              for issue in open_issues:
                existing_keywords = set(re.findall(r'\w{3,}', issue['title'].lower()))
                existing_keywords |= set(re.findall(r'\w{5,}', (issue.get('body') or '').lower()))
                 
                # Calculate similarity (need 60% keyword overlap)
                if new_keywords and existing_keywords:
                  common = new_keywords & existing_keywords
                  similarity = len(common) / max(len(new_keywords), len(existing_keywords))
                  if similarity >= 0.6:
                    with open('check_result.txt', 'w') as f:
                      f.write(f"exists=true\n")
                      f.write(f"number={issue['number']}\n")
                    print(f"⚠️ Similar issue #{issue['number']} already exists: {issue['title']}")
                    exit(0)
            except:
              pass
           
          # No duplicates found
          with open('check_result.txt', 'w') as f:
            f.write(f"exists=false\n")
          print(f"✓ No duplicate issues detected")
          PY
           
          # Read results and export to GITHUB_OUTPUT
          cat check_result.txt >> "$GITHUB_OUTPUT"

      - name: Create GitHub labels
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "enhancement" --description "New feature or request" --color a2eeef --force || true
          gh label create "feature" --description "New feature" --color a2eeef --force || true
          gh label create "auto-generated" --description "Automatically generated by workflow" --color cccccc --force || true

      - name: Create GitHub Issue
        if: steps.check.outputs.exists == 'false'
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(cat ./issue-title.txt)
          ISSUE_OUTPUT=$(gh issue create \
            --title "$TITLE" \
            --label "enhancement" \
            --label "feature" \
            --label "auto-generated" \
            --body-file ./issue-body.md)
          ISSUE_URL=$(printf '%s\n' "$ISSUE_OUTPUT" | tail -n 1)
          if [[ ! "$ISSUE_URL" =~ ^https://github\.com/[^/]+/[^/]+/issues/[0-9]+$ ]]; then
            echo "Failed to parse issue URL from gh output:"
            printf '%s\n' "$ISSUE_OUTPUT"
            exit 1
          fi
          ISSUE_NUMBER=${ISSUE_URL##*/}
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "✓ Issue created: $ISSUE_URL"

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "### ℹ️ Issue Already Exists" >> $GITHUB_STEP_SUMMARY
            echo "Issue #${{ steps.check.outputs.number }} already exists with this proposal title." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create.outcome }}" == "success" ]; then
            echo "### ✓ Issue Created Successfully" >> $GITHUB_STEP_SUMMARY
            echo "New feature proposal issue has been created:" >> $GITHUB_STEP_SUMMARY
            echo "[View Issue](${{ steps.create.outputs.issue_url }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Issue Creation Failed" >> $GITHUB_STEP_SUMMARY
            echo "Failed to create the issue. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
