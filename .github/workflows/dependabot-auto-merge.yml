name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-test-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if automerge label exists
        id: check-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name')
          if echo "$labels" | grep -q "automerge"; then
            echo "has_automerge=true" >> $GITHUB_OUTPUT
          else
            echo "has_automerge=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-label.outputs.has_automerge == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Java
        if: steps.check-label.outputs.has_automerge == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Frontend Tests
        if: ${{ steps.check-label.outputs.has_automerge == 'true' && contains(github.event.pull_request.labels.*.name, 'frontend') }}
        id: frontend_test
        continue-on-error: true
        run: |
          cd frontend
          npm ci
          npm run test:unit

      - name: Run Backend Tests
        if: ${{ steps.check-label.outputs.has_automerge == 'true' && contains(github.event.pull_request.labels.*.name, 'backend') }}
        id: backend_test
        continue-on-error: true
        run: |
          cd backend
          ./gradlew test

      - name: Check test results
        if: steps.check-label.outputs.has_automerge == 'true'
        id: test_results
        run: |
          FRONTEND_RESULT="${{ steps.frontend_test.outcome }}"
          BACKEND_RESULT="${{ steps.backend_test.outcome }}"
          
          # If both are skipped or both succeeded, tests pass
          if ( [ "$FRONTEND_RESULT" = "success" ] || [ "$FRONTEND_RESULT" = "skipped" ] ) && \
             ( [ "$BACKEND_RESULT" = "success" ] || [ "$BACKEND_RESULT" = "skipped" ] ); then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "Tests failed. Auto-fix workflow will be triggered."
          fi

      - name: Auto-approve PR
        if: |
          steps.check-label.outputs.has_automerge == 'true' &&
          steps.test_results.outputs.tests_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve

      - name: Enable auto-merge
        if: |
          steps.check-label.outputs.has_automerge == 'true' &&
          steps.test_results.outputs.tests_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash
          echo "✅ Auto-merge enabled for PR #${{ github.event.pull_request.number }}"

      - name: Comment on test failure
        if: |
          steps.check-label.outputs.has_automerge == 'true' &&
          steps.test_results.outputs.tests_passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "⚠️ Tests failed. The auto-fix workflow will attempt to resolve the issues automatically."
