name: Feature PR Planner Assist

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  post-planner-request:
    if: >-
      contains(join(github.event.pull_request.labels.*.name, ','), 'feature') ||
      startsWith(github.event.pull_request.title, 'feat:') ||
      startsWith(github.event.pull_request.title, '[FEATURE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Build and upsert planner request comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const body = pr?.body || '';

            const m = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/i);
            if (!m) {
              core.info('No linked issue (Closes #<n>) found. Skip planner assist comment.');
              return;
            }

            const issueNumber = Number(m[1]);
            const issueRes = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const issue = issueRes.data;

            const templatePath = path.join(process.cwd(), 'qa', 'test-management', 'templates', 'planner-prompt-template.md');
            if (!fs.existsSync(templatePath)) {
              core.setFailed(`Template not found: ${templatePath}`);
              return;
            }

            const slugify = (input) => String(input || '')
              .toLowerCase()
              .replace(/[^a-z0-9\u3040-\u30ff\u4e00-\u9faf\-_\s]/g, '')
              .trim()
              .replace(/\s+/g, '-')
              .slice(0, 80) || 'feature';

            const template = fs.readFileSync(templatePath, 'utf8');
            const prompt = template
              .replaceAll('{{ISSUE_NUMBER}}', String(issue.number))
              .replaceAll('{{REPO}}', `${owner}/${repo}`)
              .replaceAll('{{ISSUE_TITLE}}', issue.title || 'Untitled Issue')
              .replaceAll('{{ISSUE_BODY}}', issue.body || '(Issue本文なし)')
              .replaceAll('{{ISSUE_SLUG}}', slugify(issue.title));

            const marker = '<!-- planner-assist -->';
            const commentBody = [
              marker,
              '### 🧭 Playwright Test Agents planner 実行ガイド（自動生成）',
              '',
              `対象Issue: #${issue.number}`,
              '',
              '次を Copilot Chat に貼り付けて planner を実行してください。',
              '',
              '```markdown',
              prompt,
              '```',
              '',
              `保存先（必須）: \`qa/test-management/specs/issue-${issue.number}-*.md\``,
              '',
              '> このコメントは feature PR 更新時に自動更新されます。'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((c) => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
              core.info(`Updated planner assist comment: ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: commentBody });
              core.info('Created planner assist comment.');
            }
