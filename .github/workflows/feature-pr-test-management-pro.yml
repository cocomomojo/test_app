name: Feature PR Test Management (Pro Manual Alternative)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '対象PR番号 (例: 19)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-test-assets-manually:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ github.event.inputs.pr_number }}');
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('pr_number', String(pr.data.number));
            core.setOutput('pr_title', pr.data.title || 'Untitled PR');
            core.setOutput('pr_url', pr.data.html_url || '');
            core.setOutput('pr_user', pr.data.user?.login || 'unknown');
            core.setOutput('pr_body_b64', Buffer.from(pr.data.body || '', 'utf8').toString('base64'));

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Validate linked Issue and planner output (required)
        id: agent_guard
        run: |
          set -e
          PR_BODY="$(printf '%s' '${{ steps.pr.outputs.pr_body_b64 }}' | base64 -d)"
          ISSUE_NUMBER="$(printf '%s' "$PR_BODY" | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#[0-9]+' | head -n1 | grep -Eo '[0-9]+' || true)"

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "PR本文に Closes #<Issue番号> がありません。Playwright Test Agents の planner 成果物との紐付けのため必須です。" >&2
            exit 1
          fi

          MATCHED_SPEC="$(ls qa/test-management/specs/issue-${ISSUE_NUMBER}-*.md 2>/dev/null | head -n1 || true)"
          if [ -z "$MATCHED_SPEC" ]; then
            echo "Playwright planner 成果物が見つかりません。期待: qa/test-management/specs/issue-${ISSUE_NUMBER}-*.md" >&2
            exit 1
          fi

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "planner_spec=$MATCHED_SPEC" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build synthetic PR event payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }} > /tmp/pr.json
          jq -n --slurpfile pr /tmp/pr.json '{pull_request: $pr[0]}' > /tmp/pr-event.json
          test -s /tmp/pr-event.json

      - name: Generate test plan and Playwright skeleton
        env:
          GITHUB_EVENT_PATH: /tmp/pr-event.json
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_USER: ${{ steps.pr.outputs.pr_user }}
          PR_BODY_B64: ${{ steps.pr.outputs.pr_body_b64 }}
        run: node scripts/generate-pr-test-assets.js

      - name: Update test dashboard
        run: node scripts/update-test-dashboard.js

      - name: Commit and push generated assets
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/test-management frontend/tests/e2e/generated
          git commit -m "test: manual generate PR test plan/dashboard (#${{ github.event.inputs.pr_number }})"
          git push

      - name: Comment PR with test artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}');
            const headRef = '${{ steps.pr.outputs.head_ref }}';
            const plannerSpec = JSON.parse('${{ toJson(steps.agent_guard.outputs.planner_spec) }}');

            const metaPath = `qa/test-management/.meta/pr-${prNumber}.json`;
            if (!fs.existsSync(metaPath)) {
              core.setFailed(`metaファイルが見つかりません: ${metaPath}`);
              return;
            }

            const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
            const toUrl = (p) => `https://github.com/${owner}/${repo}/blob/${headRef}/${p}`;
            const marker = '<!-- test-management-links -->';
            const body = [
              marker,
              '### 🤖 テスト設計/テスト項目を更新しました',
              `- テスト設計 + テスト項目: [${meta.generatedPlan}](${toUrl(meta.generatedPlan)})`,
              `- E2E雛形（generator相当）: [${meta.generatedSpec}](${toUrl(meta.generatedSpec)})`,
              `- Planner成果物（必須）: [${plannerSpec}](${toUrl(plannerSpec)})`,
              '',
              '> この運用では、Playwright Test Agents（planner）成果物の存在を必須チェックしています。'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
