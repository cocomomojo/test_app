name: Feature PR Test Management (Pro Manual Alternative)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '対象PR番号 (例: 19)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-test-assets-manually:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ github.event.inputs.pr_number }}');
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate test plan and Playwright skeleton
        run: node scripts/generate-pr-test-assets.js

      - name: Update test dashboard
        run: node scripts/update-test-dashboard.js

      - name: Commit and push generated assets
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/test-management frontend/tests/e2e/generated
          git commit -m "test: manual generate PR test plan/dashboard (#${{ github.event.inputs.pr_number }})"
          git push
