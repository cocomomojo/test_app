---
name: PR Test Plan Assets

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr-test-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Scripts
        uses: github/gh-aw/actions/setup@a0ed2f46906483dcf634e8694268e4fab9b21e65
        with:
          destination: /opt/gh-aw/actions

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect Copilot availability
        id: copilot_secret
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=configured" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=COPILOT_GITHUB_TOKEN secret is not configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate COPILOT_GITHUB_TOKEN secret
        if: steps.copilot_secret.outputs.available == 'true'
        run: /opt/gh-aw/actions/validate_multi_secret.sh COPILOT_GITHUB_TOKEN 'GitHub Copilot CLI' https://github.github.com/gh-aw/reference/engines/#github-copilot-default
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Install GitHub Copilot CLI
        if: steps.copilot_secret.outputs.available == 'true'
        run: /opt/gh-aw/actions/install_copilot_cli.sh 0.0.421

      - name: Determine publication mode
        id: publication_mode
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_TEST_PLAN_PUSH_ENABLED: ${{ vars.PR_TEST_PLAN_PUSH_ENABLED }}
          PR_TEST_PLAN_PUSH_LABEL: ${{ vars.PR_TEST_PLAN_PUSH_LABEL }}
          PR_TEST_PLAN_GITHUB_TOKEN_CONFIGURED: ${{ secrets.PR_TEST_PLAN_GITHUB_TOKEN != '' }}
          # GITHUB_TOKEN is always available in GitHub Actions workflows,
          # so branch sync can proceed even without PR_TEST_PLAN_GITHUB_TOKEN.
          PUSH_TOKEN_AVAILABLE: ${{ true }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/dashboard-tools.js publication-mode

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Generate PR test assets
        run: node scripts/pr-tools.js generate-assets

      - name: Collect PR test meta
        run: node scripts/pr-tools.js collect-meta

      - name: Update test dashboard
        run: node scripts/dashboard-tools.js update-dashboard

      - name: Generate AI prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_LABEL: ${{ steps.publication_mode.outputs.required_label }}
        run: |
          node scripts/dashboard-tools.js generate-ai-prompt \
            --simulation-root . \
            --pr-number "$PR_NUMBER" \
            --scenario pull-request \
            --required-label "$PUSH_LABEL" \
            --out qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt

      - name: Execute GitHub Copilot CLI for AI suggestions
        id: copilot
        if: steps.copilot_secret.outputs.available == 'true'
        env:
          COPILOT_AGENT_RUNNER_TYPE: STANDALONE
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: /home/runner
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          /usr/local/bin/copilot \
            --add-dir "${GITHUB_WORKSPACE}" \
            --disable-builtin-mcps \
            --allow-all-tools \
            --allow-all-paths \
            --prompt "$(cat qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt)"

      - name: Ensure AI suggestion output
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_STATUS: ${{ steps.copilot.outcome || 'skipped' }}
          AI_REASON: ${{ steps.copilot_secret.outputs.reason }}
        run: |
          node scripts/dashboard-tools.js ensure-ai-output \
            --simulation-root . \
            --pr-number "$PR_NUMBER" \
            --scenario pull-request \
            --ai-status "$AI_STATUS" \
            --reason "$AI_REASON"

      - name: Upload PR test assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.publication_mode.outputs.artifact_name }}
          path: |
            qa/test-management/pr/PR-${{ github.event.pull_request.number }}-test-plan.md
            qa/test-management/.meta/pr-${{ github.event.pull_request.number }}.json
            qa/test-management/dashboard.md
            qa/test-management/ai/prompt-pr-${{ github.event.pull_request.number }}.txt
            qa/test-management/ai/pr-${{ github.event.pull_request.number }}-ai-suggestions.md
            frontend/tests/e2e/generated/pr-${{ github.event.pull_request.number }}-*.spec.ts
          if-no-files-found: warn
          retention-days: 7

      - name: Sync generated assets to PR branch
        id: branch_sync
        if: steps.publication_mode.outputs.branch_sync_enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TEST_PLAN_GITHUB_TOKEN: ${{ secrets.PR_TEST_PLAN_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          ALLOWED_PLAN="qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md"
          ALLOWED_META="qa/test-management/.meta/pr-${PR_NUMBER}.json"
          ALLOWED_DASHBOARD="qa/test-management/dashboard.md"
          ALLOWED_AI_PROMPT="qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt"
          ALLOWED_AI_SUGGESTIONS="qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md"

          TMP_DIR="$(mktemp -d)"

          mkdir -p "$TMP_DIR/qa/test-management/pr"
          mkdir -p "$TMP_DIR/qa/test-management/.meta"
          mkdir -p "$TMP_DIR/qa/test-management/ai"
          mkdir -p "$TMP_DIR/qa/test-management"
          mkdir -p "$TMP_DIR/frontend/tests/e2e/generated"

          cp "qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md" "$TMP_DIR/qa/test-management/pr/"
          cp "qa/test-management/.meta/pr-${PR_NUMBER}.json" "$TMP_DIR/qa/test-management/.meta/"
          cp "qa/test-management/dashboard.md" "$TMP_DIR/qa/test-management/"
          cp "qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt" "$TMP_DIR/qa/test-management/ai/"
          cp "qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md" "$TMP_DIR/qa/test-management/ai/"
          cp frontend/tests/e2e/generated/pr-"${PR_NUMBER}"-*.spec.ts "$TMP_DIR/frontend/tests/e2e/generated/"

          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          mkdir -p qa/test-management/pr qa/test-management/.meta qa/test-management/ai frontend/tests/e2e/generated
          cp "$TMP_DIR/qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md" qa/test-management/pr/
          cp "$TMP_DIR/qa/test-management/.meta/pr-${PR_NUMBER}.json" qa/test-management/.meta/
          cp "$TMP_DIR/qa/test-management/dashboard.md" qa/test-management/
          cp "$TMP_DIR/qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt" qa/test-management/ai/
          cp "$TMP_DIR/qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md" qa/test-management/ai/
          cp "$TMP_DIR/frontend/tests/e2e/generated/"pr-"${PR_NUMBER}"-*.spec.ts frontend/tests/e2e/generated/

          mapfile -t CHANGED_FILES < <(git status --porcelain | awk '{print $2}')
          for file in "${CHANGED_FILES[@]}"; do
            if [ "$file" = "$ALLOWED_PLAN" ] || [ "$file" = "$ALLOWED_META" ] || [ "$file" = "$ALLOWED_DASHBOARD" ] || [ "$file" = "$ALLOWED_AI_PROMPT" ] || [ "$file" = "$ALLOWED_AI_SUGGESTIONS" ] || [[ "$file" == frontend/tests/e2e/generated/pr-${PR_NUMBER}-*.spec.ts ]]; then
              continue
            fi

            echo "status=blocked" >> "$GITHUB_OUTPUT"
            echo "reason=許可対象外のファイル差分を検知したため branch 反映を中止: ${file}" >> "$GITHUB_OUTPUT"
            echo "Unexpected file change: ${file}"
            exit 1
          done

          if git diff --quiet -- qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md qa/test-management/.meta/pr-${PR_NUMBER}.json qa/test-management/dashboard.md qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md frontend/tests/e2e/generated/pr-${PR_NUMBER}-*.spec.ts; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=branch へ反映すべき差分がなかったため commit を作成しない" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md qa/test-management/.meta/pr-${PR_NUMBER}.json qa/test-management/dashboard.md qa/test-management/ai/prompt-pr-${PR_NUMBER}.txt qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md frontend/tests/e2e/generated/pr-${PR_NUMBER}-*.spec.ts
          git commit -m "test: update PR ${PR_NUMBER} test plan assets"
          PUSH_TOKEN="${PR_TEST_PLAN_GITHUB_TOKEN:-$GITHUB_TOKEN}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${HEAD_REF}"

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "reason=生成した test plan / meta / dashboard / Playwright 雛形をPR branchへ反映" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_NAME: ${{ steps.publication_mode.outputs.artifact_name }}
          BRANCH_SYNC_ENABLED: ${{ steps.publication_mode.outputs.branch_sync_enabled }}
          BRANCH_SYNC_REASON: ${{ steps.publication_mode.outputs.branch_sync_reason }}
          BRANCH_SYNC_STATUS: ${{ steps.branch_sync.outputs.status }}
          BRANCH_SYNC_RESULT_REASON: ${{ steps.branch_sync.outputs.reason }}
          REQUIRED_LABEL: ${{ steps.publication_mode.outputs.required_label }}
          COMMENT_MODE: ${{ steps.publication_mode.outputs.comment_mode }}
          IS_FORK: ${{ steps.publication_mode.outputs.is_fork }}
          COPILOT_AVAILABLE: ${{ steps.copilot_secret.outputs.available }}
          COPILOT_REASON: ${{ steps.copilot_secret.outputs.reason }}
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
        run: |
          {
            echo "## 🧪 PR Test Plan Assets"
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Test Plan: \`qa/test-management/pr/PR-${PR_NUMBER}-test-plan.md\`"
            echo "- Meta: \`qa/test-management/.meta/pr-${PR_NUMBER}.json\`"
            echo "- Dashboard: \`qa/test-management/dashboard.md\`"
            echo "- AI Suggestions: \`qa/test-management/ai/pr-${PR_NUMBER}-ai-suggestions.md\`"
            echo "- Playwright Draft: \`frontend/tests/e2e/generated/pr-${PR_NUMBER}-*.spec.ts\`"
            echo
            echo "### Publication Mode"
            echo "- Comment mode: ${COMMENT_MODE}"
            echo "- Branch sync enabled: ${BRANCH_SYNC_ENABLED}"
            echo "- Required label for branch sync: ${REQUIRED_LABEL}"
            echo "- Policy: ${BRANCH_SYNC_REASON}"
            if [ -n "$BRANCH_SYNC_STATUS" ]; then
              echo "- Branch sync result: ${BRANCH_SYNC_STATUS}"
              echo "- Branch sync note: ${BRANCH_SYNC_RESULT_REASON}"
            fi
            echo
            echo "### Copilot"
            echo "- copilot_available: ${COPILOT_AVAILABLE}"
            echo "- copilot_reason: ${COPILOT_REASON}"
            echo "- copilot_outcome: ${COPILOT_OUTCOME:-not-run}"
            echo
            echo "### Artifact の取得手順"
            echo "1. この workflow run の画面を開く"
            echo "2. 右側または下部の Artifacts セクションを開く"
            echo "3. \`${ARTIFACT_NAME}\` をダウンロードする"
            echo "4. 展開後に test plan / meta / dashboard / Playwright 雛形を確認する"
            if [ "$IS_FORK" = 'true' ]; then
              echo
              echo "> fork PR のため、PRコメントと branch 反映は行わず、artifact と workflow summary のみ提供しています。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with test assets summary
        if: steps.publication_mode.outputs.comment_mode == 'comment-and-summary'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: ${{ steps.publication_mode.outputs.artifact_name }}
          REQUIRED_LABEL: ${{ steps.publication_mode.outputs.required_label }}
          BRANCH_SYNC_ENABLED: ${{ steps.publication_mode.outputs.branch_sync_enabled }}
          BRANCH_SYNC_REASON: ${{ steps.publication_mode.outputs.branch_sync_reason }}
          BRANCH_SYNC_STATUS: ${{ steps.branch_sync.outputs.status }}
          BRANCH_SYNC_RESULT_REASON: ${{ steps.branch_sync.outputs.reason }}
          COPILOT_AVAILABLE: ${{ steps.copilot_secret.outputs.available }}
          COPILOT_REASON: ${{ steps.copilot_secret.outputs.reason }}
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- pr-test-plan-assets -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const metaPath = path.join(process.env.GITHUB_WORKSPACE, 'qa', 'test-management', '.meta', `pr-${prNumber}.json`);

            let meta = null;
            if (fs.existsSync(metaPath)) {
              meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
            }

            const body = [
              marker,
              '### 🧪 PR Test Plan Assets',
              '',
              meta
                ? `- Test Plan: \`${meta.generatedPlan || 'qa/test-management/pr/PR-' + prNumber + '-test-plan.md'}\``
                : `- Test Plan: \`qa/test-management/pr/PR-${prNumber}-test-plan.md\``,
              meta?.generatedSpec
                ? `- Playwright Draft: \`${meta.generatedSpec}\``
                : `- Playwright Draft: \`frontend/tests/e2e/generated/pr-${prNumber}-*.spec.ts\``,
              meta
                ? `- Meta: \`qa/test-management/.meta/pr-${prNumber}.json\``
                : `- Meta: \`qa/test-management/.meta/pr-${prNumber}.json\``,
              '- Dashboard: `qa/test-management/dashboard.md`',
              `- AI Suggestions: \`qa/test-management/ai/pr-${prNumber}-ai-suggestions.md\``,
              '',
              '#### Summary',
              `- E2E items: ${meta?.e2eCount ?? 'unknown'}`,
              `- Manual items: ${meta?.manualCount ?? 'unknown'}`,
              `- Integration items: ${meta?.integrationCount ?? 'unknown'}`,
              '',
              '#### Publication',
              `- Artifact: ${process.env.ARTIFACT_NAME || 'pr-test-assets-' + prNumber}`,
              `- Required label for branch sync: ${process.env.REQUIRED_LABEL || 'test-plan-sync'}`,
              `- Branch sync enabled: ${process.env.BRANCH_SYNC_ENABLED || 'false'}`,
              `- Policy: ${process.env.BRANCH_SYNC_REASON || 'n/a'}`,
              process.env.BRANCH_SYNC_STATUS
                ? `- Branch sync result: ${process.env.BRANCH_SYNC_STATUS} (${process.env.BRANCH_SYNC_RESULT_REASON || 'n/a'})`
                : '- Branch sync result: not-run',
              '',
              '#### Copilot',
              `- Copilot available: ${process.env.COPILOT_AVAILABLE || 'false'}`,
              `- Copilot reason: ${process.env.COPILOT_REASON || 'n/a'}`,
              `- Copilot outcome: ${process.env.COPILOT_OUTCOME || 'not-run'}`,
              '',
              '#### Next actions',
              '- [ ] QA が観点を確認',
              '- [ ] 必要なら test plan を追記',
              '- [ ] E2E の採否を決定',
              '- [ ] dashboard の内容を確認',
              `- Workflow Run: ${process.env.RUN_URL}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
