plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Spring Boot 基本
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // AWS SDK v2
    implementation 'software.amazon.awssdk:s3:2.25.60'
    implementation 'software.amazon.awssdk:url-connection-client:2.25.60'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MySQL Driver
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.check {
    dependsOn tasks.jacocoTestCoverageVerification
}

// E2E coverage report: merge unit + e2e exec files into a single report
tasks.register('jacocoE2EReport', JacocoReport) {
    description = 'Generates JaCoCo coverage report from E2E exec file'
    group = 'verification'

    executionData fileTree(project.rootDir).include('**/jacoco-output/jacoco.exec')
    sourceSets sourceSets.main

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Export jacocoagent.jar so CI can mount it into the Docker container
tasks.register('copyJacocoAgent', Copy) {
    description = 'Copies JaCoCo agent jar to build/jacoco for Docker mounts'
    group = 'build'

    from configurations.jacocoAgent
    into layout.buildDirectory.dir('jacoco')
    rename { 'jacocoagent.jar' }
}

configurations {
    jacocoAgent
}

dependencies {
    jacocoAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
}
